# ============================================================================
# Nginx — LJ SmartClinic
# ============================================================================
#
#     cp deploy/vps/nginx.conf /etc/nginx/sites-available/ljsmartclinic
#     ln -s /etc/nginx/sites-available/ljsmartclinic /etc/nginx/sites-enabled/
#
# TROQUE $DOMINIO pelo domínio real antes de habilitar.

# --- Redireciona HTTP para HTTPS --------------------------------------------
#
# O redirect precisa existir ANTES do certbot: o bot ca Challenges no HTTP, e
# sem este bloco o certbot falha ao validar.
server {
    listen 80;
    listen [::]:80;

    server_name $DOMINIO www.$DOMINIO;

    # Challenge do certbot não redireciona, ou o certificado nunca é emitido.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$DOMINIO$request_uri;
    }
}

# --- Aplicação --------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name $DOMINIO www.$DOMINIO;

    # Preenchido pelo certbot --nginx. Deixe assim: ele escreve os caminhos.
    ssl_certificate     /etc/letsencrypt/live/$DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$DOMINIO/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- DOCROOT ---
    #
    # `public/`, NUNCA a raiz do projeto. Este é o ponto onde uma configuração
    # errada expõe o .env inteiro pela web — com APP_KEY à vista, o que
    # significa assinar cookie de sessão, ler banco e-cliiente e entrar como
    # qualquer usuário. A raiz do projeto também tem o storage/ (logs com
    # exceção) e o vendor/.
    root /var/www/ljsmartclinic/public;

    index index.php;

    # Uploads de paciente (exame, foto clínica) podem passar de 10 MB.
    client_max_body_size 20M;

    # --- Segurança ---
    #
    # X-Frame-Options: o painel não deve ser embutido em iframe de outro
    # domínio (clickjacking).
    #
    # X-Content-Type-Options: impede o navegador de "adivinhar" o tipo de um
    # arquivo e executar texto como JavaScript.
    #
    # Referrer-Policy: sem isso o token do webhook da Meta aparece no cabeçalho
    # Referer toda vez que o usuário clica num link externo.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Não anuncia a versão do nginx na resposta.
    server_tokens off;

    # --- Compressão ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    # --- Deny de arquivos sensíveis, por segurança ---
    #
    # O docroot já é public/ e nenhum desses arquivos existe lá. É a segunda
    # camada: se alguém apontar o docroot para a raiz por engano, estes
    # bloqueios ainda seguram o .env e o código.
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~ ^/(composer\.(json|lock)|package(-lock)?\.json|artisan|README\.md|\.env) {
        deny all;
        return 404;
    }

    # --- Frontend (Vite) ---
    #
    # `immutable` porque os arquivos têm hash no nome: o conteúdo muda junto
    # com o nome, então nunca há cache velho servindo asset velho.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # --- PHP ---
    #
    # A única location que passa ao Laravel. Todo o resto do projeto é
    # inacessível pela web por construção, não por regra.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;

        # Só este arquivo é executado como PHP. Sem esta linha, um .php
        # enviado para /storage seria executado.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # timeout curto: um relatório pesado não pode segurar um worker do
        # PHP-FPM e derrubar as demais requisições.
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }


    # Página de erro do Laravel, não a do nginx: o usuário vê "clínica não
    # encontrada" em vez de um 502 do servidor.
    error_page 404 /index.php;
    error_page 500 502 503 504 /index.php;

    access_log /var/log/nginx/ljsmartclinic.access.log;
    error_log  /var/log/nginx/ljsmartclinic.error.log;
}
