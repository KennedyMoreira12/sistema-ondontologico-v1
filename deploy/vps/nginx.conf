# ============================================================================
# Nginx — LJ SmartClinic
# ============================================================================
#
#     envsubst < deploy/vps/nginx.conf > /etc/nginx/sites-available/ljsmartclinic
#     ln -s /etc/nginx/sites-available/ljsmartclinic /etc/nginx/sites-enabled/
#
# NÃO edite este arquivo à mão trocando $DOMINIO: o `envsubst` é o que
# substitui, e o 02-provisionar.sh faz isso por você.
#
# Este arquivo é SÓ HTTP, de propósito.
#
# Um template que já traz o bloco `listen 443 ssl` não sobe em servidor novo:
# o nginx dá `cannot load certificate` porque o arquivo em
# /etc/letsencrypt/live/ ainda não existe, e sem nginx no ar o Certbot não tem
# onde validar o desafio. O resultado é o deadlock clássico: o certificado
# espera o nginx, o nginx espera o certificado.
#
# A ordem correta é: nginx só em :80 -> certbot --nginx -> o Certbot escreve
# o bloco 443 ssl e o redirect de http para https sozinho. Não antecipe isso.

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMINIO} www.${DOMINIO};

    root ${DIRETORIO_APP}/public;
    index index.php;

    charset utf-8;

    # Uploads de paciente (exame, foto clínica) podem passar de 10 MB.
    client_max_body_size 32M;

    access_log /var/log/nginx/ljsmartclinic.access.log;
    error_log  /var/log/nginx/ljsmartclinic.error.log;

    # Não anuncia a versão do nginx na resposta.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS não entra aqui. Enviado por HTTP o navegador ignora, mas uma vez
    # servido o navegador exige HTTPS por 2 anos — o Certbot adiciona o header
    # no bloco 443 quando emite.

    # --- DOCROOT ---
    #
    # `public/`, NUNCA a raiz do projeto. Este é o ponto onde uma configuração
    # errada expõe o .env inteiro pela web — com APP_KEY à vista, o que
    # significa assinar cookie de sessão, ler banco de cliente e entrar como
    # qualquer usuário. A raiz do projeto também tem o storage/ (logs com
    # exceção) e o vendor/.
    #
    # --- Deny de arquivos sensíveis, por segurança ---
    #
    # O docroot já é public/ e nenhum desses arquivos existe lá. É a segunda
    # camada: se alguém apontar o docroot para a raiz por engano, estes
    # bloqueios ainda seguram o .env e o código.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~ ^/(composer\.(json|lock)|package(-lock)?\.json|artisan|README\.md|\.env) {
        deny all;
        return 404;
    }

    # Sem isto, /storage/ e qualquer pasta vazia respondem com um índice
    # navegável de todo o conteúdo.
    autoindex off;

    # --- Frontend (Vite) ---
    #
    # `immutable` porque os arquivos têm hash no nome: o conteúdo muda junto
    # com o nome, então nunca há cache velho servindo asset velho.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # --- PHP ---
    #
    # A única location que passa ao Laravel. Todo o resto do projeto é
    # inacessível pela web por construção, não por regra.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php${PHP_VERSAO}-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 180s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}