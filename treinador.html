<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treinador Interativo — SCO</title>
<style>
  :root {
    --azul:#0b7285; --azul-escuro:#083c4a; --teal:#0ca678; --verde:#2b8a3e;
    --amarelo:#f59f00; --roxo:#7048e8; --vermelho:#e03131; --cinza-bg:#eef3f6;
    --texto:#1d2b33; --mouse:#5a6a72; --borda:#dbe6ec; --branco:#fff;
    --sombra:0 6px 18px rgba(20,60,80,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:var(--cinza-bg);line-height:1.55}
  .layout{display:flex;min-height:100vh}

  /* ===== SIDEBAR ===== */
  .sidebar{width:236px;background:linear-gradient(180deg,#0b3a48,#0a4d5e);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:16px 14px;font-weight:800;font-size:1.02rem;border-bottom:1px solid rgba(255,255,255,.12)}
  .sidebar .brand .dente{font-size:1.4rem}
  .sidebar nav{padding:10px 0}
  .nav-titulo{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);padding:12px 16px 4px}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:rgba(255,255,255,.85);padding:8px 16px;font-size:.92rem;cursor:pointer;text-align:left}
  .nav-item:hover{background:rgba(255,255,255,.10)}
  .nav-item.ativo{background:rgba(255,255,255,.16);border-left:3px solid var(--teal);font-weight:600}
  .nav-item .ico{width:20px;text-align:center}

  /* ===== MAIN ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{background:var(--branco);border-bottom:1px solid var(--borda);padding:10px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
  .topbar h1{font-size:1.1rem;font-weight:700}
  .topbar .acao{display:flex;gap:8px;align-items:center}
  .area-treino{border:2px solid var(--teal);color:#11684f;background:#e6faf2;font-weight:700;padding:6px 12px;border-radius:999px;font-size:.8rem}
  .usuario{background:var(--cinza-bg);border:1px solid var(--borda);padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:600}
  .page{padding:22px;max-width:1100px;width:100%;margin:0 auto}

  /* ===== MODO TREINAMENTO ===== */
  .painel-treino{background:#fff7e6;border:1px solid #f0d48a;border-left:5px solid var(--amarelo);border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:.9rem}
  .painel-treino b{color:#8a6100}
  .painel-treino ol{margin:8px 0 0 18px}
  .painel-treino .passos span{display:inline-block;background:#0b7285;color:#fff;border-radius:5px;padding:1px 7px;margin:3px 3px 0 0;font-size:.8rem}

  /* ===== COMPONENTES ===== */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .campo{padding:8px 12px;border:1px solid var(--borda);border-radius:8px;font-size:.9rem;background:var(--branco);color:var(--texto)}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--azul);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn.teal{background:var(--teal)} .btn.verde{background:var(--verde)} .btn.vermelho{background:var(--vermelho)}
  .btn.gray{background:#6c757d} .btn.fino{padding:4px 10px;font-size:.8rem}
  .btn-link{background:none;border:none;color:var(--azul);cursor:pointer;font-size:.88rem;text-decoration:underline;padding:0}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
  .card-kpi{background:var(--branco);border:1px solid var(--borda);border-radius:12px;padding:16px;box-shadow:var(--sombra)}
  .card-kpi .v{font-size:1.6rem;font-weight:800;color:var(--azul-escuro)}
  .card-kpi .r{font-size:.8rem;color:var(--mouse)}
  .tabela-wrap{background:var(--branco);border:1px solid var(--borda);border-radius:12px;overflow:hidden;box-shadow:var(--sombra)}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th{background:#f7fafb;text-align:left;padding:10px 12px;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mouse);border-bottom:1px solid var(--borda)}
  td{padding:9px 12px;border-bottom:1px solid var(--borda)}
  tr:last-child td{border-bottom:none}
  .badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;color:#fff}
  .aviso{background:var(--branco);border:1px dashed var(--borda);border-radius:10px;padding:22px;text-align:center;color:var(--mouse);font-size:.9rem}
  .modal-bg{position:fixed;inset:0;background:rgba(8,30,40,.5);display:none;align-items:center;justify-content:center;z-index:50}
  .modal-bg.aberto{display:flex}
  .modal{background:var(--branco);border-radius:14px;padding:22px;width:min(480px,92vw);max-height:90vh;overflow:auto;box-shadow:var(--sombra)}
  .modal h3{margin-bottom:14px;font-size:1.05rem}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form-grid .full{grid-column:1/-1}
  .form-grid label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px;color:var(--mouse)}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:8px 10px;border:1px solid var(--borda);border-radius:8px;font-size:.88rem;font-family:inherit}
  .modal .acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .erro{background:#ffe9e9;border:1px solid #f0b9b9;color:#9b1c1c;padding:8px 12px;border-radius:8px;font-size:.82rem;margin-top:10px}
  .ok{background:#e6f7ec;border:1px solid #b8e6c8;color:#15572b;padding:8px 12px;border-radius:8px;font-size:.82rem;margin-top:10px}
  .dica-treino{background:#eef6ff;border:1px solid #c5dcf7;color:#1d4e8b;padding:8px 12px;border-radius:8px;font-size:.8rem;margin-bottom:14px}
  .dica-treino b{font-weight:700}
  .real{margin:14px 0;font-size:.82rem}
  .real a{color:var(--azul);font-weight:600}
  .timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;background:var(--branco);border:1px solid var(--borda);border-radius:10px;padding:14px;margin-bottom:16px}
  .tl-etapa{font-size:.75rem;color:var(--mouse);text-align:center;border-right:1px dashed var(--borda);padding-right:8px}
  .tl-etapa:last-child{border:none}
  .tl-etapa b{display:block;color:var(--texto);font-size:.82rem}
  .odonto{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;max-width:640px}
  .dente{aspect-ratio:1;background:var(--branco);border:2px solid var(--borda);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--mouse);cursor:pointer;font-size:.8rem;transition:.12s}
  .dente:hover{transform:scale(1.08);border-color:var(--teal)}
  .dente.cariado{background:var(--vermelho);border-color:#a03030;color:#fff}
  .dente.restaurado{background:var(--azul);border-color:#0a4f63;color:#fff}
  .dente.coroa{background:#f76707;border-color:#b34e05;color:#fff}
  .dente.ausente{background:#adb5bd;border-color:#8b949d;color:#fff;text-decoration:line-through}
  .dente.canal{background:var(--amarelo);border-color:#b37b00;color:#5f4300}
  .corte{display:grid;grid-template-columns:1fr 260px;gap:18px;align-items:start}
  @media(max-width:900px){.corte{grid-template-columns:1fr}.sidebar{width:200px}}
  @media(max-width:720px){.sidebar{display:none}}

  /* ===== EXPLICAÇÕES INTERATIVAS ===== */
  #dicaExpli{position:fixed;z-index:98;max-width:330px;background:#083c4a;color:#fff;padding:10px 12px;border-radius:9px;font-size:.82rem;line-height:1.45;box-shadow:0 8px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .12s}
  #tourCaixa{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(560px,94vw);background:#fff8e8;border:2px solid #f0c24b;border-radius:14px;padding:16px 18px;box-shadow:0 14px 34px rgba(0,0,0,.28);z-index:120;font-size:.9rem}
  #tourCaixa .cont{display:flex;gap:10px;align-items:flex-start}
  #tourCaixa .num{background:var(--amarelo);color:#5f4300;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.75rem;white-space:nowrap;cursor:pointer}
  .btn-ghost{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer}
  .btn-ghost:hover{background:rgba(255,255,255,.14)}
  .expli-rodape{font-size:.8rem;color:var(--mouse);border-top:1px dashed var(--borda);margin-top:12px;padding-top:8px}
</style>
</head>
<body>
<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand"><span class="dente">🦷</span> <span>Clínica Sorriso</span></div>
    <nav>
      <div class="nav-titulo">Principal</div>
      <button class="nav-item" data-mod="dashboard"><span class="ico">📊</span>Dashboard</button>

      <button class="nav-item" data-mod="agenda"><span class="ico">🗓️</span>Agenda</button>
      <button class="nav-item" data-mod="prontuario"><span class="ico">📋</span>Prontuário</button>

      <button class="nav-item" data-mod="planos"><span class="ico">💊</span>Tratamentos</button>

      <button class="nav-item" data-mod="orcamentos"><span class="ico">💰</span>Orçamentos</button>

      <button class="nav-item" data-mod="convenios"><span class="ico">🛡️</span>Convênios</button>
      <button class="nav-item" data-mod="profissionais"><span class="ico">🧑‍⚕️</span>Profissionais</button>
      <button class="nav-item" data-mod="procedimentos"><span class="ico">🩺</span>Procedimentos</button>
      <button class="nav-item" data-mod="estoque"><span class="ico">📦</span>Estoque</button>
      <button class="nav-item" data-mod="contratos"><span class="ico">📜</span>Contratos</button>
      <button class="nav-item" data-mod="relatorios"><span class="ico">📊</span>Relatórios</button>
      <div class="nav-titulo">Administração</div>
      <button class="nav-item" data-mod="admin"><span class="ico">⚙️</span>Usuários &amp; Perfis</button>
      <button class="nav-item" data-mod="auditoria"><span class="ico">🔍</span>Auditoria</button>
    </nav>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <h1 id="tituloPagina">Dashboard</h1>
      <div class="acao">
        <span class="area-treino">🎓 Modo treinamento</span>
        <span class="usuario">👤 Administrador</span>
      </div>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>

<!-- MODAL GENÉRICO -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* =========================================================

const condOrder=['cariado','restaurado','coroa','canal','ausente'];
const condLabel={cariado:'Cariado',restaurado:'Restaurado',coroa:'Coroa',canal:'Trat. canal',ausente:'Ausente'};
const stCor2 = c => ({cariado:'#e03131',restaurado:'#0b7285',coroa:'#f76707',canal:'#f59f00',ausente:'#adb5bd',higido:'#28a745'}[c]);
let ultimoDente=null;
const denteBtn = n => `<div class="dente" onclick="clicarDente(${n})" id="dente${n}">${n}</div>`;
function pagOdontograma(){
  let sup='' , inf='';
  for(let i=18;i>=11;i--) sup+=denteBtn(i);
  for(let i=21;i<=28;i++) sup+=denteBtn(i);
  for(let i=48;i>=41;i--) inf+=denteBtn(i);
  for(let i=31;i<=38;i++) inf+=denteBtn(i);
  return cabecalho('odontograma','Odontograma') + `
  <div class="dica-treino">🦷 <b>Experimente:</b> clique nos dentes do diagrama — cada clique alterna a condição (cariado → restaurado → coroa → canal → ausente → volta ao início).</div>
  <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">
    <div>
      <div class="odonto">${sup}</div>
      <div class="odonto" style="margin-top:10px">${inf}</div>
    </div>
    <div class="tabela-wrap" style="min-width:230px"><table>
      <tr><th colspan="2">Legenda / condições</th></tr>
      ${condOrder.map(c=>`<tr><td><span class="badge" style="background:${stCor2(c)}">${condLabel[c]}</span></td><td style="font-size:.78rem;cursor:pointer" onclick="aplicarCond('${c}')">clicar para aplicar no dente atual</td></tr>`).join('')}
      <tr><td><span class="badge" style="background:#28a745">Hígido</span></td><td style="font-size:.78rem;cursor:pointer" onclick="aplicarCond('higido')">clique para limpar a marca</td></tr>
      <tr><td colspan="2" id="condAtual" style="font-weight:700">—</td></tr>
    </table></div>
  </div>`;
}
function clicarDente(n){
  const el=$(`#dente${n}`);
  const atuais=condOrder.filter(c=>el.classList.contains(c));
  const idx = atuais.length ? condOrder.indexOf(atuais[0]) : -1;
  aplicarIng(n, condOrder[(idx+1)%condOrder.length]);
}
function aplicarIng(n,c){
  const el=$(`#dente${n}`);
  condOrder.forEach(x=>el.classList.remove(x));
  if(c!=='higido') el.classList.add(c);
  el.style.borderColor = c==='higido' ? '#b8c4cc' : 'rgba(0,0,0,.35)';
  ultimoDente=n;
  $('#condAtual').textContent = `Dente ${n} → ${c==='higido'?'Hígido (sadio)':condLabel[c]}`;
}
function aplicarCond(c){ if(ultimoDente!==null) aplicarIng(ultimoDente,c); }

function salvarPagamento(i){
  const c=estado.contas[i], saldo=c.valor-c.pago;
  const v=parseFloat($('#pg_val').value);
  if(v>saldo){ $('#pg_msg').innerHTML=`<div class="erro">⛔ Valor informado maior que o saldo devedor (R$ ${saldo.toFixed(2)}). O sistema real bloqueia esta operação.</div>`; return; }
  c.pago=Math.min(c.pago+v,c.valor);
  c.st = c.pago>=c.valor ? 'paga' : 'parcial'; c.forma=$('#pg_forma').value;

  flash(c.st==='paga'?`Pagamento de R$ ${v.toFixed(2)} (${c.forma}) — conta PAGA ✓`:`Pagamento parcial de R$ ${v.toFixed(2)} — saldo restante R$ ${(saldo-v).toFixed(2)} ✓`);
}

  const p=estado.produtos[i];

}
function salvarMov(i,tipo){
  const p=estado.produtos[i], q=parseInt($('#mov_qtd').value)||0;
  if(tipo==='saida' && q>p.est){ $('#mov_msg').innerHTML=`<div class="erro">⛔ Quantidade maior que o estoque atual (${p.est}). O sistema real bloqueia esta saída.</div>`; return; }
  const antes=p.est;
  p.est = tipo==='entrada' ? p.est+q : p.est-q;
  estado.estoqueHistorico.unshift({dt:'24/09',p:p.n,t:tipo,q});
  const ficouBaixo = p.est<=p.min;
  p.st_baixo = ficouBaixo;
  fecharModal(); mostrar('estoque');
  flash(`Movimentação registrada: ${antes} → ${p.est}${ficouBaixo?' — ⚠️ agora está abaixo do mínimo!':''} ✓`);
}

  dashboard:'O <b>Dashboard</b> é a porta de entrada do sistema. Ele consulta dados REAIS da clínica e mostra: (1) consultas de hoje em tabela, (2) total de pacientes, (3) tratamentos em andamento e (4) produtos com estoque baixo — além das contas a receber em aberto. <br><br>Destaque: cada indicador só aparece se o seu usuário tiver permissão do módulo (Gate). Se o Auxiliar não vê financeiro, por exemplo, o cartão nem é desenhado.',
  pacientes:'O módulo <b>Pacientes</b> centraliza o cadastro e a busca. A busca filtra por nome, CPF, e-mail, telefone fixo e celular — o MESMO critério usado pela API do WhatsApp. <br><br>Regras reais: somente o <b>nome</b> é obrigatório; o CPF é <b>único</b> (duplicidade bloqueada); ao excluir, o sistema <b>não apaga</b> — faz soft delete e marca como inativo, preservando o histórico clínico. Todo cadastro/alteração gera registro de <b>auditoria</b> com antes/depois.',
  prontuario:'A <b>ficha do paciente</b> reúne os dados e o histórico. O prontuário clínico (evoluções) registra o relato de cada atendimento: o <b>profissional logado vira o autor automaticamente</b>. A anamnese trabalha no formato <b>"pergunta: resposta"</b> (você pode colar várias linhas de uma vez). Os <b>alertas</b> ficam visíveis na ficha para situações críticas (alergias, medicações) — desativar não apaga, só esconde. Prescrições aceitam vários medicamentos com dose, frequência e duração.',
  odontograma:'O <b>odontograma</b> é o diagrama digital das duas arcadas (dentes 18–11, 21–28, 48–41 e 31–38). Cada marca registra a condição do dente (cariado, restaurado, coroa, canal, ausente) no <b>"odontograma principal"</b> do paciente. <br><br>No sistema real, cada marca guarda o <b>profissional responsável</b> e gera auditoria (ação "marcar_dente"). Remover a marca devolve o dente a <b>Hígido</b>.',
  planos:'O <b>Plano de tratamento</b> organiza os procedimentos do paciente. Regras reais do sistema: o <b>total é recalculado automaticamente</b> a cada mudança (soma dos itens − desconto, nunca negativo); o <b>valor unitário</b> vem sugerido do valor padrão do procedimento; ao marcar o plano como <b>Concluído</b>, o sistema executa todos os itens pendentes. Itens podem ser marcados executado/planejado individualmente.',
  orcamentos:'O <b>Orçamento</b> é a proposta financeira apresentada ao paciente e o passo anterior ao financeiro. A montagem é idêntica ao plano: procedimentos + quantidade + valor + desconto. O sistema apresenta <b>subtotal</b> (soma dos itens) e <b>total</b> (subtotal − desconto). Fluxo real de status: <b>Rascunho → Emitido → Aprovado</b> (a base para gerar contas a receber) → Recusado/Cancelado.',
  financeiro:'O <b>Financeiro</b> controla as contas a receber. A listagem ordena por prioridade: abertas primeiro, depois parciais e por fim pagas (todas por vencimento); há filtros por paciente e status. <br><br>Ao receber: o valor <b>não pode ultrapassar o saldo devedor</b> (bloqueio com mensagem); pagamento parcial muda a conta para <b>Parcial</b>; pagamento total muda para <b>Paga</b>. Cada recebimento grava a <b>forma de pagamento</b> (Dinheiro, PIX, cartão, boleto, convênio), o usuário responsável e gera <b>auditoria</b>.',
  convenios:'O módulo <b>Convênios</b> cadastra as <b>operadoras</b> que a clínica atende (ex.: OdontoSaúde). Cada operadora pode ter planos vinculados e é filtrada por nome/CNPJ e status ativo/inativo. No recebimento financeiro, a forma "Convênio" é usada para pagamentos via operadora.',
  profissionais:'O módulo <b>Profissionais</b> cadastra a equipe: tipo (dentista, auxiliar, recepção), CRO, especialidades e <b>comissão %</b>. O profissional é usado na <b>agenda</b> (escala), como <b>autor das evoluções</b> do prontuário e responsável técnico de planos/orçamentos. Profissionais ativos também são expostos para a <b>API do WhatsApp</b> escolher horários.',
  procedimentos:'O <b>Procedimentos</b> é o catálogo de serviços (tabela). O <b>código é único</b> (duplicidade bloqueada); a <b>duração</b> define o fim da consulta na agenda; e o <b>valor padrão</b> é sugerido automaticamente em planos e orçamentos. Ou seja, cadastrou o procedimento uma vez, ele alimenta tudo o resto.',
  estoque:'O <b>Estoque</b> gerencia materiais/insumos. Cada produto pode ter <b>estoque mínimo</b> e <b>controle ativo</b> — quando saldo ≤ mínimo, o produto fica destacado como <b>estoque baixo</b> (visível no Dashboard e Relatórios). As <b>movimentações</b> registram saldo anterior/posterior, usuário e custo; <b>saída maior que o saldo é bloqueada</b>.',
  contratos:'O módulo <b>Contratos</b> registra termos e consentimentos por paciente (tipo livre + conteúdo). O status controla o ciclo: <b>Pendente → Assinado</b> (com data) ou <b>Cancelado</b>. É a camada documental do atendimento.',
  relatorios:'O <b>Relatórios</b> é a central de indicadores por período (padrão: mês vigente). Reúne (1) resumo financeiro — a receber, em aberto, pago e <b>recebido no período</b>; (2) resumo da agenda — atendidas, canceladas e <b>faltas</b>; e (3) resumo do estoque — produtos, baixos e entradas/saídas. Ideal para acompanhar caixa e reposição.',
  admin:'A <b>Administração</b> é o RBAC (controle de acesso). Usuários têm um <b>perfil</b>; cada perfil recebe permissões por <b>módulo + ação</b> (ex.: estoque.update, orcamentos.create). Mudou uma permissão, vale para todos os usuários do perfil. <b>Segurança:</b> não dá para excluir a si mesmo, e toda operação gera auditoria. O cadastro da <b>Clínica</b> alimenta telas e a API WhatsApp.',
  auditoria:'A <b>Auditoria</b> é a trilha completa do sistema: cada ação importante registra <b>usuário, ação (criar, atualizar, excluir, marcar_dente, registrar_pagamento...), tabela, registro, quando e IP</b>, além dos valores <b>antes/depois</b>. Serve para rastrear quem fez o quê e auditar o uso do sistema. Filtros por ação e tabela.',
};

const expNav = {dashboard:'Visão geral: consultas de hoje, indicadores e contas em aberto.',pacientes:'Cadastro, busca e ficha dos pacientes.',prontuario:'Evoluções, anamneses, alertas e prescrições do paciente.',agenda:'Grade semanal de consultas + lista de espera.',odontograma:'Diagrama dental com as condições de cada dente.',planos:'Planos de tratamento com procedimentos e totais automaticos.',orcamentos:'Propostas financeiras apresentadas ao paciente.',financeiro:'Contas a receber e recebimentos.',convenios:'Operadoras e planos de convênio.',profissionais:'Equipe da clínica com CRO, especialidades e comissão.',procedimentos:'Catálogo de serviços da clínica.',estoque:'Produtos, estoque mínimo e movimentações.',contratos:'Termos e consentimentos por paciente.',relatorios:'Indicadores por período: financeiro, agenda e estoque.',admin:'Usuários, perfis, permissões e dados da clínica.',auditoria:'Trilha de quem fez o quê, quando e como.'};

const divDica = document.createElement('div');
divDica.id='dicaExpli';
document.body.appendChild(divDica);
let alvoDica=null;

function anotar(mod){
  (ANOTACOES[mod]||[]).forEach(([sel,texto])=>{
    document.querySelectorAll('#page '+sel).forEach(el=>{ if(!el.dataset.explicacao) el.dataset.explicacao=texto; });
  });
}
function mostrarDica(el, x, y){
  if(!el){ divDica.style.opacity=0; alvoDica=null; return; }
  alvoDica=el;
  divDica.textContent=el.dataset.explicacao;
  divDica.style.opacity=1;
  const r=el.getBoundingClientRect();
  const lx = Math.min(r.right+12, innerWidth-340);
  divDica.style.left = Math.max(6, lx)+'px';
  divDica.style.top  = Math.max(6, (y||r.top))+10+'px';
}
document.addEventListener('mouseover', e=>{
  const el=e.target.closest && e.target.closest('[data-explicacao]');
  if(el===alvoDica) return;
  if(el) mostrarDica(el, e.clientX, e.clientY);
  else mostrarDica(null);
});
document.addEventListener('mouseout', e=>{
  const el=e.target.closest && e.target.closest('[data-explicacao]');
  if(el && e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-explicacao]')===el) return;
  if(!el || !e.relatedTarget) mostrarDica(null);
});
document.addEventListener('click', e=>{
  const expli=e.target.closest && e.target.closest('[data-explicacao]');
  if(expli && !expli.closest('[onclick]') && !['INPUT','SELECT','TEXTAREA','BUTTON'].includes(expli.tagName)){
    abrirModal(`<h3>💡 ${expli.dataset.explicacao.split(/[.:]/)[0]} — como funciona</h3><p style="font-size:.92rem">${expli.dataset.explicacao}</p>
      <div class="expli-rodape">🖱️ Passe o mouse em outros elementos da tela para ler mais explicações, ou use a <b>Visita guiada</b> (botão azul acima) para ver tudo passo a passo.</div>
      <div class="acoes"><button class="btn teal" onclick="fecharModal()">Entendi</button></div>`);
  }
});

/* ===== COMO FUNCIONA / VISITA GUIADA ===== */
document.addEventListener('click', e=>{
  const cf=e.target.closest && e.target.closest('.btn-como-funciona');
  if(cf){
    const m=cf.dataset.mod;
    abrirModal(`<h3>❓ Como funciona: ${titulos[m]||m}</h3><p style="font-size:.94rem">${EXP_MSG[m]||'...'}</p>
      <div class="expli-rodape">Depois de ler, clique em <b>Visita guiada</b> para percorrer os elementos da tela na prática.</div>
      <div class="acoes"><button class="btn teal" onclick="fecharModal()">Entendi</button></div>`);
    return;
  }
  const tg=e.target.closest && e.target.closest('.btn-tour');
  if(tg) iniciarTour(tg.dataset.mod);
});

const tourCaixa=document.createElement('div');
tourCaixa.id='tourCaixa';
tourCaixa.style.display='none';
document.body.appendChild(tourCaixa);
let tourState=null;
function iniciarTour(){
  const alvos=Array.from(document.querySelectorAll('#page [data-explicacao]')).filter(el=>el.offsetParent!==null);
  if(!alvos.length){ flash('Esta tela não tem passos guiados.'); return; }
  tourState={lista:alvos,i:0};
  pintarTour();
}
function turDim(){
  const page=$('#page'), alvo=tourState.lista[tourState.i];
  const caminho=[]; let x=alvo;
  while(x && x!==page){ caminho.push(x); x=x.parentElement; }
  Array.from(page.querySelectorAll('*')).forEach(n=>{
    if(caminho.includes(n) || n===alvo) n.style.opacity='1';
    else if(n.closest('script')) return;
    else n.style.opacity='.18';
  });
}
function pintarTour(){
  const t=tourState, el=t.lista[t.i];
  turDim();
  el.style.outline='3px solid #f59f00'; el.style.outlineOffset='3px'; el.style.transform='scale(1.02)';
  el.scrollIntoView({behavior:'smooth', block:'center'});
  tourCaixa.style.display='block';
  tourCaixa.innerHTML=`<div class="cont"><span class="num">PASSO ${t.i+1}/${t.lista.length}</span>
    <div style="flex:1"><p style="font-size:.9rem">${el.dataset.explicacao}</p>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn gray fino" ${t.i===0?'disabled':''} onclick="tourAnt()">← Anterior</button>
      <button class="btn fino" ${t.i===t.lista.length-1?'disabled':''} onclick="tourProx()">Próximo →</button>
      <button class="btn teal fino" onclick="fecharTour()">Encerrar ${t.i===t.lista.length-1?'✓':''}</button>
    </div></div></div>`;
}
function tourAnt(){ if(tourState && tourState.i>0){ tourState.i--; pintarTour(); } }
function tourProx(){ if(tourState && tourState.i<tourState.lista.length-1){ tourState.i++; pintarTour(); } }
function fecharTour(){
  document.querySelectorAll('#page *').forEach(n=>{ n.style.opacity=''; n.style.outline=''; n.style.transform=''; });
  tourCaixa.style.display='none'; tourState=null;
}

/* ===== ROTEAMENTO ===== */
function mostrar(mod){
  if(tourState) fecharTour();
  $('#tituloPagina').textContent = titulos[mod]||mod;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('ativo', b.dataset.mod===mod));
  const paginas={dashboard:pagDashboard,pacientes:pagPacientes,prontuario:pagFicha,pacientes_ficha:pagFicha,agenda:pagAgenda,odontograma:pagOdontograma,planos:pagPlanos,orcamentos:pagOrcamentos,financeiro:pagFinanceiro,convenios:pagConvenios,profissionais:pagProfissionais,procedimentos:pagProcedimentos,estoque:pagEstoque,contratos:pagContratos,relatorios:pagRelatorios,admin:pagAdmin,auditoria:pagAuditoria};
  $('#page').innerHTML = (paginas[mod]||pagDashboard).call();
  anotar(mod);
  if(mod==='pacientes'){
    const input=$('#buscaPac'); if(input) input.oninput=()=>{ $('#corpoPac').innerHTML=pacientesRows(estado.pacientes,input.value); };
  }
  window.location.hash=mod;
}
function modReplace(m){ return m; }
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>mostrar(b.dataset.mod)));
function inicio(){ const h=location.hash.replace('#',''); document.querySelectorAll('.nav-item').forEach(b=>{ const t=expNav[b.dataset.mod]; if(t) b.dataset.explicacao=t; }); mostrar(modulos[h]!==undefined?h:'dashboard'); }
inicio();
</script>
