<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LJ SmartClinic - Treinamento Clínica Daiane</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<style>
:root {
  --azul:#0b7285; --teal:#0ca678; --teal-claro:#38d9a9; --verde:#2b8a3e; --amarelo:#f59f00; --roxo:#7048e8; --vermelho:#e03131;
  --cinza-bg:#eef3f6; --texto:#1d2b33; --mouse:#5a6a72; --borda:#dbe6ec; --branco:#fff;
  --sombra:0 6px 18px rgba(20,60,80,.08);
  --sidebar-bg:linear-gradient(180deg,#0c1f2c 0%,#0d5e6d 120%);
  --sidebar-border:rgba(255,255,255,.05);
  --topbar-bg:rgba(255,255,255,.85);
  --topbar-shadow:0 1px 0 rgba(20,60,80,.06);
  --card-bg:#fff; --card-shadow:0 8px 24px rgba(20,60,80,.07); --card-hover-shadow:0 14px 30px rgba(20,60,80,.12);
  --input-bg:#fff; --input-border:#dbe6ec;
  --modal-bg:#fff; --modal-shadow:0 24px 60px rgba(5,20,30,.35);
  --progress-bg:rgba(255,255,255,.07); --progress-border:rgba(255,255,255,.12);
  --search-bg:rgba(255,255,255,.08); --search-border:rgba(255,255,255,.14);
  --treino-bg:linear-gradient(135deg,#fffaf0,#fff3d6); --treino-border:#f4d78e;
  --dica-bg:#f0f8ff; --dica-border:#cfe0ff;
}
[data-theme="dark"] {
  --cinza-bg:#0a1c28; --texto:#e6f4f0; --mouse:#8ae7c6; --borda:#1a3a4a;
  --branco:#0d2d3d; --sombra:0 6px 18px rgba(0,0,0,.3);
  --sidebar-bg:linear-gradient(180deg,#06121a 0%,#082a35 120%);
  --sidebar-border:rgba(255,255,255,.03);
  --topbar-bg:rgba(13,29,45,.9); --topbar-shadow:0 1px 0 rgba(0,0,0,.2);
  --card-bg:#0d2d3d; --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-hover-shadow:0 14px 30px rgba(0,0,0,.35);
  --input-bg:#0d2d3d; --input-border:#1a3a4a;
  --modal-bg:#0d2d3d; --modal-shadow:0 24px 60px rgba(0,0,0,.45);
  --progress-bg:rgba(255,255,255,.05); --progress-border:rgba(255,255,255,.08);
  --search-bg:rgba(255,255,255,.06); --search-border:rgba(255,255,255,.1);
  --treino-bg:linear-gradient(135deg,#1a1500,#2d2000); --treino-border:#5a4500;
  --dica-bg:#0d1f35; --dica-border:#1a3a5c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:linear-gradient(180deg,#eef5f7,#e7f1f4);line-height:1.55;transition:background .3s,color .3s}
[data-theme="dark"] body{background:linear-gradient(180deg,#0a1c28,#0d2d3d);color:#e6f4f0}
.layout{display:flex;min-height:100vh;gap:0}
.sidebar{width:236px;background:var(--sidebar-bg);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--sidebar-border);box-shadow:2px 0 18px rgba(8,25,35,.18);transition:background .3s,border-color .3s,box-shadow .3s}
.sidebar .brand{display:flex;align-items:center;gap:12px;padding:20px 16px;font-weight:800;font-size:1.02rem;border-bottom:1px solid rgba(255,255,255,.12)}
.sidebar .brand .icone{font-size:1.15rem;background:linear-gradient(135deg,var(--teal),#69db7c);width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(12,166,120,.4)}
.sidebar nav{padding:10px 0}
.busca-wrap{margin:12px 10px 2px}
#buscaMod{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--search-border);background:var(--search-bg);color:#fff;font-size:.85rem;outline:none;transition:.15s}
#buscaMod::placeholder{color:rgba(255,255,255,.45)}
#buscaMod:focus{border-color:var(--teal-claro);background:rgba(255,255,255,.16)}
.busca-dica{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.5);font-size:.7rem;padding:4px 14px 8px}
.busca-dica b{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:1px 7px;font-size:.68rem}
.prog-wrap{margin:0 10px 12px;background:var(--progress-bg);border:1px solid var(--progress-border);border-radius:12px;padding:10px 12px}
.prog-topo{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:.78rem;font-weight:700;margin-bottom:6px}
.prog-topo .zera{background:none;border:none;color:rgba(255,255,255,.55);font-size:.68rem;cursor:pointer;text-decoration:underline;padding:0}
.prog-barra{height:8px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
.prog-barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal-claro),#4dabf7);border-radius:999px;transition:width .4s ease}
.nav-titulo{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);padding:12px 16px 4px;margin-top:14px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:rgba(255,255,255,.85);padding:9px 12px;font-size:.92rem;cursor:pointer;text-align:left;border-radius:10px;margin:2px 8px;transition:background .15s,transform .15s;font-weight:500;position:relative}
.nav-item:hover{background:rgba(255,255,255,.09);transform:translateX(3px)}
.nav-item.ativo{background:linear-gradient(90deg,var(--teal),var(--teal-claro));border-left:none;color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(18,184,134,.35)}
.nav-item.feito .ok{opacity:1}
.nav-item .ok{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--teal-claro);font-size:.9rem;font-weight:800;opacity:0;transition:opacity .2s}
.nav-item .ico{width:20px;text-align:center;font-size:1rem}
.nav-item.escondido{display:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--topbar-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--borda);padding:10px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:var(--topbar-shadow);transition:background .3s,border-color .3s,box-shadow .3s}
.topbar h1{font-size:1.18rem;font-weight:700;letter-spacing:-.01em}
.topbar .acao{display:flex;gap:8px;align-items:center}
.area-treino{background:linear-gradient(135deg,var(--teal),var(--teal-claro));color:#fff;border:none;padding:6px 12px;border-radius:999px;font-size:.8rem;font-weight:700;box-shadow:0 4px 12px rgba(18,184,134,.35)}
.usuario{background:#f2f7f9;border:1px solid var(--borda);padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:600}
[data-theme="dark"] .usuario{background:#1a3a4a;border-color:#2a4a5a}
.page{padding:22px;max-width:1100px;width:100%;margin:0 auto;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.campo{padding:8px 12px;border:1px solid var(--input-border);border-radius:10px;font-size:.9rem;background:var(--input-bg);color:var(--texto);outline:none;transition:.15s}
.campo:focus{border-color:var(--teal)}
.btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--azul),#1d8aa3);color:#fff;border:none;padding:8px 14px;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(11,114,133,.18);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(11,114,133,.26);filter:brightness(1.05)}
.btn:active{transform:scale(.97)}
.btn.teal{background:linear-gradient(135deg,var(--teal),var(--teal-claro));box-shadow:0 4px 12px rgba(12,166,120,.35)}
.btn.verde{background:linear-gradient(135deg,var(--verde),#37b24d);box-shadow:0 4px 12px rgba(43,138,62,.35)}
.btn.vermelho{background:linear-gradient(135deg,var(--vermelho),#f03e3e);box-shadow:0 4px 12px rgba(224,49,49,.35)}
.btn.amarelo{background:linear-gradient(90deg,var(--amarelo),#fbbf24);color:#4a2e00;box-shadow:0 4px 12px rgba(245,159,0,.35)}
.btn.roxo{background:linear-gradient(135deg,var(--roxo),#8466f0);box-shadow:0 4px 12px rgba(112,72,232,.35)}
.btn.gray{background:#6c757d;box-shadow:0 4px 12px rgba(108,117,125,.35)}
.btn.fino{padding:4px 10px;font-size:.8rem}
.btn-link{background:none;border:none;color:var(--azul);cursor:pointer;font-size:.88rem;text-decoration:underline;padding:0}
.btn-ghost{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;padding:8px 14px;border-radius:9px;font-size:.8rem;font-weight:600;cursor:pointer;transition:.12s}
.btn-ghost:hover{filter:brightness(1.05);background:rgba(255,255,255,.14)}
.btn-como-funciona{background:linear-gradient(90deg,var(--teal),var(--teal-claro));border:none}
.btn-tour{background:linear-gradient(90deg,#4dabf7,#3d97e8);border:none}
.btn-quiz{background:linear-gradient(90deg,var(--amarelo),#fbbf24);border:none;color:#4a2e00;font-weight:800;box-shadow:0 4px 12px rgba(245,159,0,.35)}
.btn-apresenta{background:linear-gradient(135deg,var(--roxo),#8466f0);border:none;color:#fff;padding:8px 14px;border-radius:9px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(112,72,232,.35);display:inline-flex;align-items:center;gap:6px}
.btn-apresenta:hover{filter:brightness(1.06)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.card-kpi{position:relative;overflow:hidden;background:var(--card-bg);border:none;border-radius:16px;padding:16px;box-shadow:var(--card-shadow);transition:transform .15s ease,box-shadow .15s ease}
.card-kpi:hover{transform:translateY(-3px);box-shadow:var(--card-hover-shadow)}
.card-kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--teal),#69db7c)}
.card-kpi .v{font-size:1.6rem;font-weight:800;background:linear-gradient(120deg,var(--azul-escuro),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.card-kpi .r{font-size:.8rem;color:var(--mouse)}
.tabela-wrap{background:var(--card-bg);border:1px solid var(--borda);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(20,60,80,.06);transition:background .3s,border-color .3s,box-shadow .3s}
[data-theme="dark"] .tabela-wrap{box-shadow:0 8px 24px rgba(0,0,0,.2)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{background:rgba(12,166,120,.05);text-align:left;padding:10px 12px;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mouse);border-bottom:1px solid var(--borda);font-weight:700}
[data-theme="dark"] th{background:rgba(12,166,120,.08);color:#4dabf7}
td{padding:9px 12px;border-bottom:1px solid var(--borda)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(12,166,120,.03)}
[data-theme="dark"] tr:hover td{background:rgba(12,166,120,.06)}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);letter-spacing:.02em}
.aviso{background:var(--card-bg);border:1px dashed var(--borda);border-radius:10px;padding:22px;text-align:center;color:var(--mouse);font-size:.9rem}
.painel-treino{background:var(--treino-bg);border:1px solid var(--treino-border);border-left:5px solid var(--amarelo);border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:.9rem;box-shadow:0 6px 18px rgba(245,159,0,.12);transition:background .3s,border-color .3s,box-shadow .3s}
.painel-treino b{color:#8a6100}
[data-theme="dark"] .painel-treino b{color:#f59f00}
.painel-treino ol{margin:8px 0 0 18px}
.painel-treino .passos span{display:inline-block;background:var(--azul);color:#fff;border-radius:5px;padding:1px 7px;margin:3px 3px 0 0;font-size:.8rem}
.dica-treino{background:var(--dica-bg);border:1px solid var(--dica-border);border-left:4px solid #74c0fc;color:#1d4e8b;padding:8px 12px;border-radius:8px;font-size:.8rem;margin-bottom:14px;transition:background .3s,border-color .3s}
.dica-treino b{font-weight:700}
[data-theme="dark"] .dica-treino{color:#74c0fc}
.corte{display:grid;grid-template-columns:1fr 260px;gap:18px;align-items:start}
@media(max-width:900px){.corte{grid-template-columns:1fr}.sidebar{width:200px}}
@media(max-width:720px){.sidebar{display:none}}
#dicaExpli{position:fixed;z-index:98;max-width:330px;background:linear-gradient(135deg,#0c2535,#0b5e6e);color:#fff;padding:10px 12px;border-radius:10px;font-size:.82rem;line-height:1.45;box-shadow:0 12px 26px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);opacity:0;pointer-events:none;transition:opacity .12s}
#tourDim{position:fixed;inset:0;background:rgba(7,20,30,.55);z-index:80;display:none;pointer-events:none;transition:background .2s ease}
#tourCaixa{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(560px,94vw);background:#fff8e8;border:2px solid #f0c24b;border-radius:16px;padding:16px 18px;box-shadow:0 14px 34px rgba(0,0,0,.28);z-index:150;font-size:.9rem;display:none}
#tourCaixa .cont{display:flex;gap:10px;align-items:flex-start}
#tourCaixa .num{background:var(--amarelo);color:#5f4300;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.75rem;white-space:nowrap;cursor:pointer}
.expli-rodape{font-size:.8rem;color:var(--mouse);border-top:1px dashed var(--borda);margin-top:12px;padding-top:8px}
.modal-bg{position:fixed;inset:0;background:rgba(9,24,33,.55);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:50}
.modal-bg.aberto{display:flex}
.modal{background:var(--modal-bg);border-radius:18px;padding:22px;width:min(480px,92vw);max-height:90vh;overflow:auto;box-shadow:var(--modal-shadow);animation:popIn .22s ease;color:var(--texto);transition:background .3s,box-shadow .3s}
@keyframes popIn{from{transform:scale(.94) translateY(12px);opacity:0}}
.modal h3{margin-bottom:14px;font-size:1.05rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.form-grid label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px;color:var(--mouse)}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:8px 10px;border:1px solid var(--input-border);border-radius:8px;font-size:.88rem;font-family:inherit;background:var(--input-bg);color:var(--texto);transition:border .15s}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:var(--teal);outline:none}
.modal .acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.erro{background:#fff1f0;border:1px solid #ffbfb5;color:#9b1c1c;padding:8px 12px;border-radius:8px;font-size:.82rem;margin-top:10px}
.ok{background:#e6f7ec;border:1px solid #b8e6c8;color:#15572b;padding:8px 12px;border-radius:8px;font-size:.82rem;margin-top:10px}
.painel-desafios{background:linear-gradient(135deg,#f4f8ff,#ecf3ff);border:1px solid #cfe0ff;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:.85rem;transition:background .3s,border-color .3s}
[data-theme="dark"] .painel-desafios{background:linear-gradient(135deg,#0d1f35,#142d55);border-color:#1a3a5c}
.painel-desafios .tit{font-weight:800;margin-bottom:6px;color:#274a8c}
[data-theme="dark"] .painel-desafios .tit{color:#74c0fc}
.painel-desafios ul{list-style:none}
.painel-desafios li{display:flex;align-items:center;gap:8px;padding:3px 0;color:#3a4a63}
[data-theme="dark"] .painel-desafios li{color:#a8c8f0}
.painel-desafios li .ch{width:18px;height:18px;border-radius:6px;border:1px solid #b7c9e8;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;background:#fff;flex:none}
[data-theme="dark"] .painel-desafios li .ch{background:#0d2d3d;border-color:#2a4a5a}
.painel-desafios li.feito{color:#19794f;text-decoration:line-through}
[data-theme="dark"] .painel-desafios li.feito{color:#38d9a9}
.painel-desafios li.feito .ch{background:#37b24d;border-color:#37b24d;color:#fff}
.quiz-opcao{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 14px;border-radius:10px;border:1px solid #cfdfef;background:#fff;font-size:.9rem;cursor:pointer;transition:.12s}
[data-theme="dark"] .quiz-opcao{background:#0d2d3d;border-color:#1a3a4a;color:var(--texto)}
.quiz-opcao:hover:not([disabled]){border-color:var(--teal);background:#f0fbf8}
[data-theme="dark"] .quiz-opcao:hover:not([disabled]){border-color:var(--teal-claro);background:rgba(12,166,120,.1)}
.quiz-opcao.certo{background:#e6f9ef;border-color:#37b24d;color:#186534;font-weight:700}
[data-theme="dark"] .quiz-opcao.certo{background:rgba(55,178,77,.15);border-color:#37b24d;color:#69db7c}
.quiz-opcao.errado{background:#fff1f0;border-color:#e03131;color:#a3260f}
[data-theme="dark"] .quiz-opcao.errado{background:rgba(224,49,49,.1);border-color:#e03131;color:#f08080}
.quiz-fb{font-size:.9rem;margin-top:12px;font-weight:700}
.quiz-progress{display:flex;gap:6px;margin-bottom:16px}
.quiz-progress .step{flex:1;height:6px;border-radius:999px;background:var(--borda);transition:background .3s}
[data-theme="dark"] .quiz-progress .step{background:#1a3a4a}
.quiz-progress .step.active{background:var(--teal)}
.quiz-progress .step.done{background:var(--verde)}
#slides{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 20% 10%,#0d5e6d,transparent),radial-gradient(900px 600px at 85% 15%,var(--teal),transparent),linear-gradient(160deg,#0a1c28,#0c3f52);color:#fff}
#slides.aberto{display:flex}
.slides-deck{width:min(880px,93vw);max-height:86vh;display:flex;flex-direction:column}
.slides-topo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.slides-topo .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 14px;font-size:.78rem;font-weight:600}
.slides-progresso{flex:1;height:6px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden}
.slides-progresso i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-claro),#4dabf7);border-radius:999px;transition:width .3s ease}
.slides-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:22px;padding:42px 46px;animation:slideIn .45s ease;box-shadow:0 30px 70px rgba(0,0,0,.4);overflow:auto}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.slides-icon{width:74px;height:74px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2.3rem;background:rgba(12,166,120,.22);border:1px solid rgba(56,217,169,.4);margin-bottom:18px}
.slides-card h2{font-size:1.9rem;margin-bottom:6px;letter-spacing:-.01em}
.slides-card .modulo-chip{display:inline-block;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:#8ae7c6;margin-bottom:16px;font-weight:700}
.slides-card p{font-size:1.05rem;line-height:1.7;color:#e6f4f0}
.slides-card ul{list-style:none;margin-top:8px}
.slides-card li{font-size:1.02rem;line-height:1.6;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.14);display:flex;gap:10px}
.slides-card li::before{content:"✦";color:var(--teal-claro)}
.slides-nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:52px;height:52px;border-radius:50%;font-size:1.8rem;cursor:pointer;transition:background .15s,transform .15s}
.slides-nav:hover{background:rgba(255,255,255,.24);transform:translateY(-50%) scale(1.05)}
.slides-nav.prev{left:22px}
.slides-nav.next{right:22px}
.slides-fecha{position:fixed;top:20px;right:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.1rem;cursor:pointer;z-index:5}
.slides-fecha:hover{background:rgba(255,255,255,.25)}
.slides-setas-hint{display:flex;justify-content:center;gap:10px;margin-top:18px;font-size:.8rem;color:rgba(255,255,255,.6)}

function init(){
  initTheme();
  carregaProgresso();
  renderNav();
  renderProgresso();
  mostrar('dashboard');
  setupAtalhos();
  setupBusca();
  setupSidebarNavigation();
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}

// ===== TEMA =====
function initTheme(){let t='light';try{t=localStorage.getItem('daiane_theme')||'light'}catch(e){}document.documentElement.setAttribute('data-theme',t);}
function toggleTheme(){const n=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('daiane_theme',n)}catch(e){}const t=document.getElementById('themeToggle');if(t)t.setAttribute('data-theme',n);}

// ===== PROGRESSO =====
function carregaProgresso(){try{const p=localStorage.getItem('daiane_progresso');if(p){estadoApp.progresso=JSON.parse(p);estadoApp.desafiosFeitos=JSON.parse(localStorage.getItem('daiane_desafios')||'{}');}}catch(e){}}
function salvaProgresso(){try{localStorage.setItem('daiane_progresso',JSON.stringify(estadoApp.progresso));localStorage.setItem('daiane_desafios',JSON.stringify(estadoApp.desafiosFeitos));}catch(e){}}
function fez(acao){const mod=estadoApp.modAtual;estadoApp.progresso[mod]=Math.min(100,(estadoApp.progresso[mod]||0)+10);if(!estadoApp.desafiosFeitos[mod])estadoApp.desafiosFeitos[mod]={};estadoApp.desafiosFeitos[mod][acao]=true;salvaProgresso();renderNav();renderProgresso();}
function zerarProgresso(){if(!confirm('Apagar TODO o progresso (checklists, desafios, quiz)?'))return;try{localStorage.removeItem('daiane_progresso');localStorage.removeItem('daiane_desafios')}catch(e){}estadoApp.progresso={};estadoApp.desafiosFeitos={};renderNav();renderProgresso();mostrar(estadoApp.modAtual);toast('Progresso zerado');}
function renderProgresso(){const mods=Object.keys(modulos);const total=mods.length;let feitos=0;mods.forEach(m=>{if((estadoApp.progresso[m]||0)>=100)feitos++;});document.getElementById('progNum').textContent=feitos+'/'+total;document.getElementById('progBarra').style.width=((feitos/total)*100)+'%';}

// ===== NAVEGAÇÃO SIDEBAR =====
function renderNav(){document.querySelectorAll('.nav-item').forEach(btn=>{const m=btn.dataset.mod;const feito=(estadoApp.progresso[m]||0)>=100;btn.classList.toggle('feito',feito);if(feito)btn.querySelector('.ok')?.remove();});}
function setupSidebarNavigation(){const itens=document.querySelectorAll('#navLista .nav-item');estadoApp.focoIdx=0;function atualizaFoco(){itens.forEach((b,i)=>b.classList.toggle('foco',i===estadoApp.focoIdx));if(itens[estadoApp.focoIdx])itens[estadoApp.focoIdx].scrollIntoView({block:'nearest'});}atualizaFoco();window.navSidebar={itens,atualizaFoco,getIdx:()=>estadoApp.focoIdx,setIdx:i=>{estadoApp.focoIdx=Math.max(0,Math.min(itens.length-1,i));atualizaFoco()}};}

// ===== BUSCA SIDEBAR =====
function setupBusca(){
  const inp=document.getElementById('buscaMod');
  inp.addEventListener('input',()=>{
    const f=inp.value.toLowerCase().trim();
    document.querySelectorAll('.nav-item').forEach(b=>{
      const t=b.textContent.toLowerCase();
      b.classList.toggle('escondido',f&&!t.includes(f));
    });
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const vis=document.querySelectorAll('.nav-item:not(.escondido)');
      if(vis.length){vis[0].click();inp.value='';vis.forEach(v=>v.classList.remove('escondido'));}
    }
    if(e.key==='Escape'){
      inp.value='';
      document.querySelectorAll('.nav-item.escondido').forEach(v=>v.classList.remove('escondido'));
      inp.blur();
    }
  });
}

// ===== ATALHOS GLOBAIS =====
function setupAtalhos(){
  document.addEventListener('keydown',e=>{
    const tag=e.target.tagName;
    const editavel=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
    if((e.key==='/'&&!editavel)||(e.ctrlKey&&e.key.toLowerCase()==='k')){
      e.preventDefault();
      document.getElementById('buscaMod').focus();
    }
    if(!editavel&&['ArrowUp','ArrowDown','ArrowRight','Enter'].includes(e.key)){
      const nav=window.navSidebar;
      if(!nav)return;
      if(e.key==='ArrowUp'){nav.setIdx(nav.getIdx()-1);e.preventDefault();}
      if(e.key==='ArrowDown'){nav.setIdx(nav.getIdx()+1);e.preventDefault();}
      if(e.key==='ArrowRight'||e.key==='Enter'){nav.itens[nav.getIdx()]?.click();e.preventDefault();}
    }
    if(!editavel){
      if(e.key.toLowerCase()==='t'){e.preventDefault();toggleTheme();}
      if(e.key.toLowerCase()==='g'){e.preventDefault();toggleTour();}
      if(e.key.toLowerCase()==='q'){e.preventDefault();abrirQuiz(estadoApp.modAtual);}
      if(e.key.toLowerCase()==='p'){e.preventDefault();abrirSlides();}
      if(e.key==='?'||(e.key==='/'&&e.shiftKey)){e.preventDefault();toggleDicas();}
    }
    if(e.key==='Escape'){
      fecharModal();fecharSlides();pararTour();
      document.getElementById('tourCaixa').style.display='none';
      document.getElementById('tourDim').style.display='none';
      document.getElementById('buscaMod').value='';
      document.querySelectorAll('.nav-item.escondido').forEach(v=>v.classList.remove('escondido'));
    }
  });
}

// ===== MOSTRAR MÓDULO =====
function mostrar(mod){
  if(!modulos.hasOwnProperty(mod))mod='dashboard';
  estadoApp.modAtual=mod;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('ativo',b.dataset.mod===mod));
  const idx=Object.keys(modulos).indexOf(mod);
  if(window.navSidebar)window.navSidebar.setIdx(idx);
  document.getElementById('tituloPagina').textContent=titulos[mod];
  document.getElementById('page').innerHTML=renderPagina(mod);
  renderProgresso();
  try{history.replaceState(null,'',mod);}catch(e){}
}
function renderPagina(mod){
  const fn=window['pag'+mod.charAt(0).toUpperCase()+mod.slice(1)];
  return fn?fn():'<div class="aviso">Módulo em construção</div>';
}

// ===== CABEÇALHO PADRÃO =====
function cabecalho(mod,titulo,extra=''){
  return '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--azul);border-radius:10px;padding:8px 12px;margin-bottom:12px"><button class="btn-como-funciona btn-ghost" data-mod="'+mod+'" onclick="abrirComoFunciona(\''+mod+'\')">❓ Como funciona</button><button class="btn-tour btn-ghost" data-mod="'+mod+'" onclick="iniciarTour(\''+mod+'\')">▶ Visita guiada</button><button class="btn-quiz" onclick="abrirQuiz(\''+mod+'\')">🎯 Quiz</button><span style="color:#eafff7;font-size:.8rem">🖱️ Passe o mouse sobre elementos para explicações — clique para ampliar</span></div>'+barraDesafios(mod)+'<div class="painel-treino">🎓 <b>Treine nesta tela:</b><div class="passos">'+(treinoInfo[mod]||'')+'</div></div><div class="dica-treino">💡 <b>Abrir no sistema real:</b> <a target="_blank" href="'+realLink(mod)+'">'+titulo+'</a> (login: admin@sco.com / admin123).</div>'+extra;
}
function barraDesafios(mod){
  const itens=desafiosData[mod]||[];
  const feitos=estadoApp.desafiosFeitos[mod]||{};
  return '<div class="painel-desafios"><div class="tit">🏁 Desafios: '+itens.filter(d=>feitos[d]).length+'/'+itens.length+' concluídos</div><ul>'+itens.map(d=>'<li'+(feitos[d]?' class="feito"':'')+'><span class="ch">'+(feitos[d]?'✓':'')+'</span>'+d+'</li>').join('')+'</ul></div>';
}

  alvo.style.outline='3px solid var(--amarelo)';

  alvo.style.borderRadius='8px';

// ===== QUIZ =====
function abrirQuiz(mod){
  const q=quizData[mod];
  if(!q||!q.length){toast('Quiz não disponível');return;}
  estadoApp.quizState={mod,idx:0,respostas:[]};
  const prog=q.map((_,i)=>'<div class="step '+(i<0?'done':'')+' '+(i===0?'active':'')+'"></div>').join('');
  const firstQ=q[0];
  const optsHtml=firstQ.op.map((o,j)=>'<button class="quiz-opcao" onclick="selQuiz('+j+')">'+o+'</button>').join('');
  abrirModal('<h3>🎯 Quiz — '+titulos[mod]+'</h3><div id="quizArea"><div class="quiz-progress">'+prog+'</div><div class="quiz-pergunta"><h4>Pergunta 1 de '+q.length+'</h4><p style="font-size:1.05rem;font-weight:600;margin:12px 0">'+firstQ.q+'</p><div class="quiz-opcoes">'+optsHtml+'</div></div><div class="acoes" style="margin-top:16px"><button class="btn gray" onclick="quizAnterior()" id="quizPrev" disabled>← Anterior</button><button class="btn teal" onclick="quizProximo()" id="quizNext">Próximo →</button><button class="btn amarelo" onclick="finalizarQuiz()" id="quizFinish" style="display:none">Ver resultado</button></div>');
}
function renderQuiz(){
  const {mod,idx,respostas}=estadoApp.quizState;
  const q=quizData[mod][idx];
  const prog=quizData[mod].map((_,i)=>'<div class="step '+(i<idx?'done':'')+' '+(i===idx?'active':'')+'"></div>').join('');
  document.getElementById('quizArea').innerHTML='<div class="quiz-progress">'+prog+'</div><div class="quiz-pergunta"><h4>Pergunta '+(idx+1)+' de '+quizData[mod].length+'</h4><p style="font-size:1.05rem;font-weight:600;margin:12px 0">'+q.q+'</p><div class="quiz-opcoes">'+q.op.map((o,j)=>'<button class="quiz-opcao '+(respostas[idx]===j?'selecionado':'')+'" onclick="selQuiz('+j+')" '+(respostas[idx]!==undefined&&respostas[idx]!==j?'disabled':'')+'>'+o+'</button>').join('')+'</div>'+(respostas[idx]!==undefined?'<div class="quiz-fb '+(respostas[idx]===q.c?'certo':'errado')+'">'+(respostas[idx]===q.c?'✅ Correto!':'❌ Incorreto.')+' '+q.exp+'</div>':'')+'</div>';
  document.getElementById('quizPrev').disabled=idx===0;
  if(idx===quizData[mod].length-1){
    document.getElementById('quizNext').style.display='none';
    document.getElementById('quizFinish').style.display='inline-flex';
  }else{
    document.getElementById('quizNext').style.display='inline-flex';
    document.getElementById('quizFinish').style.display='none';
    document.getElementById('quizNext').textContent=respostas[idx]!==undefined?'Próximo →':'Responda para continuar';
    document.getElementById('quizNext').disabled=respostas[idx]===undefined;
  }
}
function selQuiz(j){estadoApp.quizState.respostas[estadoApp.quizState.idx]=j;renderQuiz();}
function quizProximo(){const {mod}=estadoApp.quizState;if(estadoApp.quizState.idx<quizData[mod].length-1){estadoApp.quizState.idx++;renderQuiz();}}
function quizAnterior(){if(estadoApp.quizState.idx>0){estadoApp.quizState.idx--;renderQuiz();}}
function finalizarQuiz(){
  const {mod,respostas}=estadoApp.quizState;
  let acertos=0;
  quizData[mod].forEach((q,i)=>{if(respostas[i]===q.c)acertos++;});
  const pct=Math.round((acertos/quizData[mod].length)*100);
  fecharModal();
  abrirModal('<div style="text-align:center;padding:20px"><div style="font-size:3rem;margin-bottom:8px">'+(pct>=70?'🏆':'📚')+'</div><h3 style="margin-bottom:8px">'+(pct>=70?'Parabéns!':'Continue estudando')+'</h3><p style="font-size:1.2rem;margin-bottom:16px">'+acertos+' de '+quizData[mod].length+' corretas — <b>'+pct+'%</b></p>'+(pct>=70?'<button class="btn amarelo" onclick="gerarCertificado(\''+mod+'\','+pct+')">🏆 Gerar Certificado</button>':'<button class="btn teal" onclick="abrirQuiz(\''+mod+'\')">🔄 Tentar novamente</button>')+'<button class="btn gray" onclick="fecharModal()" style="margin-left:8px">Fechar</button></div>');
  fez('quiz_'+(pct>=70?'aprovado':'reprovado'));
}
function gerarCertificado(mod,pct){
  fecharModal();
  const data=new Date().toLocaleDateString('pt-BR');
  abrirModal('<div style="text-align:center;border:2px solid var(--amarelo);border-radius:16px;padding:32px;background:linear-gradient(135deg,#fffaf0,#fff3d6);position:relative"><div style="font-size:3rem;margin-bottom:12px">🏆</div><h3 style="color:var(--azul-escuro);margin-bottom:4px">Certificado de Conclusão</h3><p style="color:var(--mouse);margin-bottom:16px">Certificamos que</p><p style="font-size:1.5rem;font-weight:700;color:var(--azul-escuro);margin-bottom:8px">Usuário Daiane</p><p style="color:var(--mouse);margin-bottom:8px">concluiu o módulo <b>'+titulos[mod]+'</b> com <b>'+pct+'%</b> de aproveitamento</p><p style="font-size:.85rem;color:var(--mouse);margin-top:16px">Data: '+data+'</p></div><div class="acoes" style="margin-top:16px"><button class="btn amarelo" onclick="imprimirCertificado()">🖨️ Imprimir/Salvar PDF</button><button class="btn gray" onclick="fecharModal()">Fechar</button></div>');
}
function imprimirCertificado(){
  const html=document.getElementById('modalBox').innerHTML;
  const w=window.open('','_blank');
  w.document.write('<html><head><title>Certificado</title><style>body{font-family:Segoe UI;padding:40px;text-align:center}@media print{body{padding:0}}</style></head><body>'+html+'</body></html>');
  w.document.close(); w.focus(); w.print();
}

// ===== APRESENTAÇÃO =====
function abrirSlides(){
  const s=slidesData[estadoApp.modAtual]||slidesData.dashboard;
  estadoApp.slidesState={mod:estadoApp.modAtual,idx:0};
  renderSlide();
  document.getElementById('slides').classList.add('aberto');
}
function fecharSlides(){document.getElementById('slides').classList.remove('aberto');}
function slideVai(dir){
  const s=slidesData[estadoApp.slidesState.mod];
  estadoApp.slidesState.idx=Math.max(0,Math.min(s.length-1,estadoApp.slidesState.idx+dir));
  renderSlide();
}
function renderSlide(){
  const {mod,idx}=estadoApp.slidesState;
  const s=slidesData[mod][idx];
  document.getElementById('slideModChip').textContent=s.modulo;
  document.getElementById('slideContador').textContent=(idx+1)+' / '+slidesData[mod].length;
  document.getElementById('slideBarra').style.width=((idx+1)/slidesData[mod].length)*100+'%';
  document.getElementById('slideCard').innerHTML='<div class="slides-icon">'+s.icon+'</div><h2>'+s.title+'</h2><span class="modulo-chip">'+s.modulo+'</span><ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>';
}

  if(tab==='alert'){return '<div class="toolbar"><button class="btn teal" onclick="abrirModal(alertaForm())">⚠️ Novo alerta</button></div><div class="tabela-wrap"><table><tr><th>Título</th><th>Descrição</th><th>Status</th></tr>'+p.alertas.map(a=>'<tr><td>'+a.titulo+'</td><td>'+a.desc+'</td><td>'+(a.ativo?stBadge('Ativo'):stBadge('Inativo'))+'</td></tr>').join('')+'</table></div>';}

  if(tab==='docs'){return '<div class="toolbar"><button class="btn teal" onclick="abrirModal(docForm())">📎 Anexar documento</button></div><div class="tabela-wrap"><table><tr><th>Tipo</th><th>Título</th><th>Data</th></tr>'+p.documentos.map(d=>'<tr><td>'+d.tipo+'</td><td>'+d.titulo+'</td><td>'+d.data+'</td></tr>').join('')+'</table></div>';}
  return '';}

const condOrder=['cariado','restaurado','coroa','canal','ausente'];const condLabel={cariado:'Cariado',restaurado:'Restaurado',coroa:'Coroa',canal:'Trat. canal',ausente:'Ausente'};const stCor2=c=>({cariado:'#e03131',restaurado:'#0b7285',coroa:'#f76707',canal:'#f59f00',ausente:'#adb5bd',higido:'#28a745'}[c]);const denteBtn=n=>'<div class="dente" onclick="clicarDente('+n+')" id="dente'+n+'">'+n+'</div>';
function pagOdontograma(){let sup='',inf='';for(let i=18;i>=11;i--)sup+=denteBtn(i);for(let i=21;i<=28;i++)sup+=denteBtn(i);for(let i=48;i>=41;i--)inf+=denteBtn(i);for(let i=31;i<=38;i++)inf+=denteBtn(i);return cabecalho('odontograma','Odontograma')+'<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start"><div><div class="odonto">'+sup+'</div><div class="odonto" style="margin-top:10px">'+inf+'</div></div><div class="tabela-wrap" style="min-width:230px"><table><tr><th colspan="2">Legenda / condições</th></tr>'+condOrder.map(c=>'<tr><td><span class="badge" style="background:'+stCor2(c)+'">'+condLabel[c]+'</span></td><td style="font-size:.78rem;cursor:pointer" onclick="aplicarCond(\''+c+'\')">clicar para aplicar no dente atual</td></tr>').join('')+'<tr><td><span class="badge" style="background:#28a745">Hígido</span></td><td style="font-size:.78rem;cursor:pointer" onclick="aplicarCond(\'higido\')">clique para limpar a marca</td></tr><tr><td colspan="2" id="condAtual" style="font-weight:700">—</td></tr></table></div></div>';}
function clicarDente(n){const el=document.getElementById('dente'+n);const atuais=condOrder.filter(c=>el.classList.contains(c));const idx=atuais.length?condOrder.indexOf(atuais[0]):-1;aplicarIng(n,condOrder[(idx+1)%condOrder.length]);}
function aplicarIng(n,c){const el=document.getElementById('dente'+n);condOrder.forEach(x=>el.classList.remove(x));if(c!=='higido')el.classList.add(c);el.style.borderColor=c==='higido'?'#b8c4cc':'rgba(0,0,0,.35)';if(c!=='higido')fez('dente_marcado');document.getElementById('condAtual').textContent='Dente '+n+' → '+(c==='higido'?'Hígido (sadio)':condLabel[c]);}
function aplicarCond(c){const el=document.getElementById('condAtual');if(el.textContent.includes('Dente')){const n=parseInt(el.textContent.match(/\d+/)[0]);aplicarIng(n,c);}}

function pagFinanceiro(){return cabecalho('financeiro','Financeiro — Contas a Receber')+'<div class="cards"><div class="card-kpi"><div class="v">R$ '+estado.financeiro.filter(c=>c.st!=='paga').reduce((s,c)=>s+c.valor,0).toFixed(2)+'</div><div class="r">Total em aberto</div></div><div class="card-kpi"><div class="v">'+estado.financeiro.filter(c=>c.st==='aberta').length+'</div><div class="r">Abertas</div></div><div class="card-kpi"><div class="v">'+estado.financeiro.filter(c=>c.st==='parcial').length+'</div><div class="r">Parciais</div></div></div><div class="tabela-wrap"><table><tr><th>Paciente</th><th>Vencimento</th><th>Valor</th><th>Pago</th><th>Saldo</th><th>Status</th><th></th></tr>'+estado.financeiro.map((c,i)=>'<tr><td>'+c.pac+'</td><td>'+c.venc+'</td><td>R$ '+c.valor.toFixed(2)+'</td><td>R$ '+c.pago.toFixed(2)+'</td><td style="font-weight:700;'+(c.st!=='paga'?'color:#d33':'')+'">R$ '+(c.valor-c.pago).toFixed(2)+'</td><td>'+(c.st==='aberta'?stBadge('Aberta'):c.st==='parcial'?stBadge('Parcial'):stBadge('Paga'))+'</td><td>'+(c.st==='paga'?'—':'<button class="btn verde fino" onclick="abrirModal(pagamentoForm('+i+'))">Receber</button>')+'</td></tr>').join('')+'</table></div>';}
function pagamentoForm(i){const c=estado.financeiro[i],saldo=c.valor-c.pago;return '<h3>💵 Receber pagamento — '+c.pac+'</h3><div class="form-grid"><div><label>Valor (saldo R$ '+saldo.toFixed(2)+')</label><input id="pg_val" type="number" step="0.01" value="'+saldo+'"></div><div><label>Forma de pagamento</label><select id="pg_forma"><option>PIX</option><option>Dinheiro</option><option>Cartão de crédito</option><option>Cartão de débito</option><option>Boleto</option><option>Convênio</option></select></div><div class="full"><label>Data</label><input type="date" value="'+new Date().toISOString().slice(0,10)+'"></div></div><div id="pg_msg"></div><div class="acoes"><button class="btn gray" onclick="fecharModal()">Cancelar</button><button class="btn verde" onclick="salvarPagamento('+i+')">Confirmar pagamento</button></div>';}
function salvarPagamento(i){const c=estado.financeiro[i],saldo=c.valor-c.pago,v=parseFloat(document.getElementById('pg_val').value);if(v>saldo){document.getElementById('pg_msg').innerHTML='<div class="erro">⛔ Valor informado maior que o saldo devedor (R$ '+saldo.toFixed(2)+'). O sistema real bloqueia esta operação.</div>';return;}c.pago=Math.min(c.pago+v,c.valor);c.st=c.pago>=c.valor?'paga':'parcial';c.forma=document.getElementById('pg_forma').value;fez('receber');fecharModal();mostrar('financeiro');toast(c.st==='paga'?'Pagamento de R$ '+v.toFixed(2)+' ('+c.forma+') — conta PAGA ✓':'Pagamento parcial de R$ '+v.toFixed(2)+' — saldo restante R$ '+(saldo-v).toFixed(2)+' ✓');}

function pagConvenios(){return cabecalho('convenios','Convênios')+'<div class="toolbar"><button class="btn teal" onclick="abrirModal(convenioForm())">+ Nova operadora</button><input class="campo" placeholder="Buscar por nome ou CNPJ..."></div><div class="tabela-wrap"><table><tr><th>Operadora</th><th>CNPJ</th><th>Planos</th><th>Status</th></tr>'+estado.convenios.map(c=>'<tr><td><b>'+c.n+'</b></td><td>'+c.cnpj+'</td><td>'+c.planos+'&nbsp;planos</td><td><span class="badge" style="background:#198754">Ativo</span></td></tr>').join('')+'</table></div>';}

function pagProfissionais(){return cabecalho('profissionais','Profissionais')+'<div class="toolbar"><button class="btn teal" onclick="abrirModal(profissionalForm())">+ Novo profissional</button><input class="campo" placeholder="Buscar por nome ou CRO..."></div><div class="tabela-wrap"><table><tr><th>Nome</th><th>CRO</th><th>Tipo</th><th>Especialidades</th><th>Comissão</th><th>Status</th></tr>'+estado.profissionais.map(p=>'<tr><td><b>'+p.n+'</b></td><td>'+(p.cro||'—')+'</td><td>'+p.t+'</td><td>'+(p.esp||'—')+'</td><td>'+(p.com?p.com+'%':'—')+'</td><td><span class="badge" style="background:#198754">Ativo</span></td></tr>').join('')+'</table></div>';}

function pagProcedimentos(){return cabecalho('procedimentos','Procedimentos')+'<div class="toolbar"><button class="btn teal" onclick="abrirModal(procedimentoForm())">+ Novo procedimento</button><select class="campo"><option>Todas as categorias</option><option>Prevenção</option><option>Consulta</option><option>Endodontia</option><option>Restauradora</option><option>Cirurgia</option><option>Prótese</option><option>Estética</option></select></div><div class="tabela-wrap"><table><tr><th>Código</th><th>Nome</th><th>Categoria</th><th>Duração</th><th>Valor padrão</th><th>Status</th></tr>'+estado.procedimentos.map(p=>'<tr><td><b>'+p.cod+'</b></td><td>'+p.nome+'</td><td>'+p.cat+'</td><td>'+p.dur+' min</td><td>R$ '+p.val.toFixed(2)+'</td><td><span class="badge" style="background:#198754">Ativo</span></td></tr>').join('')+'</table></div>';}
function procedimentoForm(){return '<h3>🩺 Novo procedimento</h3><div class="form-grid"><div><label>Código *</label><input id="pr_cod" placeholder="EX: RES_AME"></div><div><label>Nome *</label><input></div><div><label>Categoria</label><select><option>Prevenção</option><option>Consulta</option><option>Exame</option><option>Endodontia</option><option>Restauradora</option><option>Cirurgia</option><option>Prótese</option><option>Estética</option></select></div><div><label>Duração (min)</label><input type="number" value="30" min="1"></div><div><label>Valor padrão (R$)</label><input type="number" step="0.01"></div><div class="full"><label>Descrição</label><textarea rows="2"></textarea></div></div><div class="acoes"><button class="btn gray" onclick="fecharModal()">Cancelar</button><button class="btn teal" onclick="registrar(\'procedimento\',\'Procedimento cadastrado com sucesso ✓\')">Salvar</button></div>';}

function pagEstoque(){return cabecalho('estoque','Estoque')+'<div style="display:flex;gap:14px;flex-wrap:wrap"><div class="tabela-wrap" style="flex:1;min-width:300px"><table><tr><th>Produto</th><th>Categoria</th><th>Estoque</th><th>Mín</th><th>Ações</th></tr>'+estado.estoque.map((p,i)=>'<tr><td><b>'+p.n+'</b>'+(p.baixo?' <span class="badge" style="background:#e03131">Baixo</span>':'')+'</td><td>'+p.cat+'</td><td><b id="estQtd'+i+'">'+p.est+'</b></td><td>'+p.min+'</td><td><button class="btn verde fino" onclick="abrirModal(movForm('+i+',\'entrada\'))">+Entrada</button><button class="btn vermelho fino" onclick="abrirModal(movForm('+i+',\'saida\'))">−Saída</button></td></tr>').join('')+'</table></div></div><div class="tabela-wrap" style="margin-top:16px"><table><tr><th>Histórico de movimentações</th><th>Tipo</th><th>Qtd</th></tr><tr><td>22/11 — Luvas</td><td>'+stBadge('Entrada')+'</td><td>+20</td></tr><tr><td>23/11 — Resina</td><td>'+stBadge('Saída')+'</td><td>-5</td></tr><tr><td>24/11 — Anestésico</td><td>'+stBadge('Entrada')+'</td><td>+10</td></tr></table></div>';}
function movForm(i,tipo){const p=estado.estoque[i];return '<h3>'+(tipo==='entrada'?'📦 Entrada no estoque':'📦 Saída do estoque')+' — '+p.n+'</h3><div class="form-grid"><div><label>Quantidade</label><input id="mv_qtd" type="number" min="1" value="1"></div><div><label>Valor unit. (R$)</label><input id="mv_vlr" type="number" step="0.01" value="'+p.custo+'"></div><div class="full"><label>Observação</label><input id="mv_obs" placeholder="Fornecedor / Motivo"></div></div><div class="acoes"><button class="btn gray" onclick="fecharModal()">Cancelar</button><button class="btn '+(tipo==='entrada'?'verde':'vermelho')+'" onclick="salvarMov('+i+',\''+tipo+'\')">'+(tipo==='entrada'?'Entrada':'Saída')+'</button></div>';}
function salvarMov(i,tipo){const p=estado.estoque[i],q=parseInt(document.getElementById('mv_qtd').value)||1;if(tipo==='saida'&&q>p.est){toast('⛔ Saída maior que saldo ('+p.est+') — bloqueada');return;}p.est+=tipo==='entrada'?q:-q;document.getElementById('estQtd'+i).textContent=p.est;p.baixo=p.est<=p.min;fez('estoque_'+tipo);fecharModal();mostrar('estoque');toast((tipo==='entrada'?'Entrada':'Saída')+' de '+q+' '+p.n+' ✓');}

function pagContratos(){return cabecalho('contratos','Contratos')+'<div class="toolbar"><button class="btn teal" onclick="abrirModal(contratoForm())">+ Novo contrato</button><input class="campo" placeholder="Buscar por paciente ou tipo..."></div><div class="tabela-wrap"><table><tr><th>Paciente</th><th>Tipo</th><th>Status</th><th>Data</th><th></th></tr>'+estado.contratos.map(c=>'<tr><td>'+c.pac+'</td><td>'+c.tipo+'</td><td>'+(c.st==='Assinado'?stBadge('Assinado'):stBadge('Pendente'))+'</td><td>'+c.data+'</td><td>'+(c.st==='Pendente'?'<button class="btn verde fino" onclick="toast(\'Contrato assinado ✓\');fez(\'assinar_contrato\');mostrar(\'contratos\')">Assinar</button>':'—')+'</td></tr>').join('')+'</table></div>';}

// ===== TOAST/FLASH =====
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>{t.style.animation='slideUp .3s ease reverse';setTimeout(()=>t.style.display='none',300);},3000);}
function flash(msg){toast(msg);}
function registrar(tipo,msg){fez(tipo+'_criado');fecharModal();toast(msg);}
