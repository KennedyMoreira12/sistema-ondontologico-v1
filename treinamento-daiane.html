<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treinamento Interativo — Clínica Daiane Teixeira · Fisioterapia</title>
<style>
  :root {
    --azul:#0b7285; --azul-escuro:#083c4a; --teal:#0ca678; --verde:#2b8a3e;
    --amarelo:#f59f00; --roxo:#7048e8; --vermelho:#e03131; --cinza-bg:#eef3f6;
    --texto:#1d2b33; --mouse:#5a6a72; --borda:#dbe6ec; --branco:#fff;
    --sombra:0 6px 18px rgba(20,60,80,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:var(--cinza-bg);line-height:1.55}
  .layout{display:flex;min-height:100vh}

  /* ===== SIDEBAR ===== */
  .sidebar{width:236px;background:linear-gradient(180deg,#0b3a48,#0a4d5e);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:16px 14px;font-weight:800;font-size:1.02rem;border-bottom:1px solid rgba(255,255,255,.12)}
  .sidebar .brand .dente{font-size:1.4rem}
  .sidebar nav{padding:10px 0}
  .nav-titulo{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);padding:12px 16px 4px}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:rgba(255,255,255,.85);padding:8px 16px;font-size:.92rem;cursor:pointer;text-align:left}
  .nav-item:hover{background:rgba(255,255,255,.10)}
  .nav-item.ativo{background:rgba(255,255,255,.16);border-left:3px solid var(--teal);font-weight:600}
  .nav-item .ico{width:20px;text-align:center}
  .nav-item.nav-sub{padding-left:32px;font-size:.82rem;opacity:.92}
  .nav-item.nav-sub .ico{width:18px;font-size:.9rem}
  .nav-tag{margin-left:auto;font-size:.56rem;text-transform:uppercase;letter-spacing:.06em;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#ffe8a3;border-radius:999px;padding:1px 6px;font-weight:800;white-space:nowrap}
  .planejado{background:#fff4e6;border:1px solid #f0c78a;border-left:5px solid var(--amarelo);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:.88rem;color:#7a4b00}
  .planejado b{color:#8a5300}
  .abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

  /* ===== MAIN ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{background:var(--branco);border-bottom:1px solid var(--borda);padding:10px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
  .topbar h1{font-size:1.1rem;font-weight:700}
  .topbar .acao{display:flex;gap:8px;align-items:center}
  .area-treino{border:2px solid var(--teal);color:#11684f;background:#e6faf2;font-weight:700;padding:6px 12px;border-radius:999px;font-size:.8rem}
  .usuario{background:var(--cinza-bg);border:1px solid var(--borda);padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:600}
  .page{padding:22px;max-width:1100px;width:100%;margin:0 auto}

  /* ===== MODO TREINAMENTO ===== */
  .painel-treino{background:#fff7e6;border:1px solid #f0d48a;border-left:5px solid var(--amarelo);border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:.9rem}
  .painel-treino b{color:#8a6100}
  .painel-treino ol{margin:8px 0 0 18px}
  .painel-treino .passos span{display:inline-block;background:#0b7285;color:#fff;border-radius:5px;padding:1px 7px;margin:3px 3px 0 0;font-size:.8rem}

  /* ===== COMPONENTES ===== */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .campo{padding:8px 12px;border:1px solid var(--borda);border-radius:8px;font-size:.9rem;background:var(--branco);color:var(--texto)}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--azul);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn.teal{background:var(--teal)} .btn.verde{background:var(--verde)} .btn.vermelho{background:var(--vermelho)}
  .btn.gray{background:#6c757d} .btn.fino{padding:4px 10px;font-size:.8rem}
  .btn-link{background:none;border:none;color:var(--azul);cursor:pointer;font-size:.88rem;text-decoration:underline;padding:0}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
  .card-kpi{background:var(--branco);border:1px solid var(--borda);border-radius:12px;padding:16px;box-shadow:var(--sombra)}
  .card-kpi .v{font-size:1.6rem;font-weight:800;color:var(--azul-escuro)}
  .card-kpi .r{font-size:.8rem;color:var(--mouse)}
  .tabela-wrap{background:var(--branco);border:1px solid var(--borda);border-radius:12px;overflow:hidden;box-shadow:var(--sombra)}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th{background:#f7fafb;text-align:left;padding:10px 12px;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mouse);border-bottom:1px solid var(--borda)}
  td{padding:9px 12px;border-bottom:1px solid var(--borda)}
  tr:last-child td{border-bottom:none}
  .badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;color:#fff}
  .aviso{background:var(--branco);border:1px dashed var(--borda);border-radius:10px;padding:22px;text-align:center;color:var(--mouse);font-size:.9rem}
  .modal-bg{position:fixed;inset:0;background:rgba(8,30,40,.5);display:none;align-items:center;justify-content:center;z-index:50}
  .modal-bg.aberto{display:flex}
  .modal{background:var(--branco);border-radius:14px;padding:22px;width:min(480px,92vw);max-height:90vh;overflow:auto;box-shadow:var(--sombra)}
  .modal h3{margin-bottom:14px;font-size:1.05rem}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form-grid .full{grid-column:1/-1}
  .form-grid label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px;color:var(--mouse)}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:8px 10px;border:1px solid var(--borda);border-radius:8px;font-size:.88rem;font-family:inherit}
  .modal .acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .erro{background:#ffe9e9;border:1px solid #f0b9b9;color:#9b1c1c;padding:8px 12px;border-radius:8px;font-size:.82rem;margin-top:10px}
  .ok{background:#e6f7ec;border:1px solid #b8e6c8;color:#15572b;padding:8px 12px;border-radius:8px;font-size:.82rem;margin-top:10px}
  .dica-treino{background:#eef6ff;border:1px solid #c5dcf7;color:#1d4e8b;padding:8px 12px;border-radius:8px;font-size:.8rem;margin-bottom:14px}
  .dica-treino b{font-weight:700}
  .real{margin:14px 0;font-size:.82rem}
  .real a{color:var(--azul);font-weight:600}
  .timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;background:var(--branco);border:1px solid var(--borda);border-radius:10px;padding:14px;margin-bottom:16px}
  .tl-etapa{font-size:.75rem;color:var(--mouse);text-align:center;border-right:1px dashed var(--borda);padding-right:8px}
  .tl-etapa:last-child{border:none}
  .tl-etapa b{display:block;color:var(--texto);font-size:.82rem}
  .odonto{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;max-width:640px}
  .dente{aspect-ratio:1;background:var(--branco);border:2px solid var(--borda);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--mouse);cursor:pointer;font-size:.8rem;transition:.12s}
  .dente:hover{transform:scale(1.08);border-color:var(--teal)}
  .dente.cariado{background:var(--vermelho);border-color:#a03030;color:#fff}
  .dente.restaurado{background:var(--azul);border-color:#0a4f63;color:#fff}
  .dente.coroa{background:#f76707;border-color:#b34e05;color:#fff}
  .dente.ausente{background:#adb5bd;border-color:#8b949d;color:#fff;text-decoration:line-through}
  .dente.canal{background:var(--amarelo);border-color:#b37b00;color:#5f4300}
  .corte{display:grid;grid-template-columns:1fr 260px;gap:18px;align-items:start}
  @media(max-width:900px){.corte{grid-template-columns:1fr}.sidebar{width:200px}}
  @media(max-width:720px){.sidebar{display:none}}

  /* ===== EXPLICAÇÕES INTERATIVAS ===== */
  #dicaExpli{position:fixed;z-index:98;max-width:330px;background:#083c4a;color:#fff;padding:10px 12px;border-radius:9px;font-size:.82rem;line-height:1.45;box-shadow:0 8px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .12s}
  #tourCaixa{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(560px,94vw);background:#fff8e8;border:2px solid #f0c24b;border-radius:14px;padding:16px 18px;box-shadow:0 14px 34px rgba(0,0,0,.28);z-index:150;font-size:.9rem}
  #tourDim{position:fixed;inset:0;background:rgba(7,20,30,.55);z-index:80;display:none;pointer-events:none;transition:background .2s ease}
  #tourCaixa .cont{display:flex;gap:10px;align-items:flex-start}
  #tourCaixa .num{background:var(--amarelo);color:#5f4300;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.75rem;white-space:nowrap;cursor:pointer}
  .btn-ghost{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer}
  .btn-ghost:hover{background:rgba(255,255,255,.14)}
  .expli-rodape{font-size:.8rem;color:var(--mouse);border-top:1px dashed var(--borda);margin-top:12px;padding-top:8px}

  /* ===== NOVO TEMA (visual premium) ===== */
  html{scroll-behavior:smooth}
  body{background:linear-gradient(180deg,#eef5f7,#e7f1f4);color:#16303c}
  .layout{gap:0}
  .sidebar{background:linear-gradient(180deg,#0c1f2c 0%,#0d5e6d 120%);border-right:1px solid rgba(255,255,255,.05);box-shadow:2px 0 18px rgba(8,25,35,.18)}
  .sidebar .brand{padding:20px 16px;gap:12px}
  .sidebar .brand .dente{font-size:1.15rem;background:linear-gradient(135deg,#0ca678,#38d9a9);width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(12,166,120,.4)}
  .nav-titulo{margin-top:14px}
  .nav-item{border-radius:10px;margin:2px 8px;padding:9px 12px;transition:background .15s,transform .15s;font-weight:500}
  .nav-item:hover{background:rgba(255,255,255,.09);transform:translateX(3px)}
  .nav-item.ativo{background:linear-gradient(90deg,#0ca678,#12b886);border-left:none;color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(18,184,134,.35)}
  .topbar{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(20,60,80,.06)}
  .topbar h1{font-size:1.18rem;letter-spacing:-.01em}
  .area-treino{background:linear-gradient(135deg,#12b886,#0ca678);color:#fff;border:none;box-shadow:0 4px 12px rgba(18,184,134,.35)}
  .usuario{background:#f2f7f9;border-color:#dbe8ee}
  .page{animation:fadeUp .35s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .painel-treino{background:linear-gradient(135deg,#fffaf0,#fff3d6);border-color:#f4d78e;box-shadow:0 6px 18px rgba(245,159,0,.12)}
  .dica-treino{border-left:4px solid #74c0fc;background:#f0f8ff}
  .card-kpi{position:relative;overflow:hidden;border:none;border-radius:16px;box-shadow:0 8px 24px rgba(20,60,80,.07);transition:transform .15s ease,box-shadow .15s ease}
  .card-kpi:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,60,80,.12)}
  .card-kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--teal),#69db7c)}
  .card-kpi .v{background:linear-gradient(120deg,#0b3f52,#0ca678);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tabela-wrap{border-radius:16px;border-color:#e2edf2;box-shadow:0 8px 24px rgba(20,60,80,.06)}
  th{background:#0ca6780d;color:#2f6f7e;font-weight:700}
  tr:hover td{background:#f2fbf8}
  .btn{border-radius:10px;box-shadow:0 4px 12px rgba(11,114,133,.18);transition:transform .12s,box-shadow .12s,filter .12s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(11,114,133,.26)}
  .btn:active{transform:scale(.97)}
  .btn.teal{background:linear-gradient(135deg,#0ca678,#12b886)}
  .btn.verde{background:linear-gradient(135deg,#2f9e44,#37b24d)}
  .btn.vermelho{background:linear-gradient(135deg,#e03131,#f03e3e)}
  .campo{border-radius:10px;background:#fff}
  .badge{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);letter-spacing:.02em}
  .modal-bg{backdrop-filter:blur(5px);background:rgba(9,24,33,.55)}
  .modal{border-radius:18px;animation:popIn .22s ease;box-shadow:0 24px 60px rgba(5,20,30,.35)}
  @keyframes popIn{from{transform:scale(.94) translateY(12px);opacity:0}}
  .erro{background:#fff1f0;border-color:#ffbfb5}
  .odonto{background:linear-gradient(180deg,#f4fbf9,#e9f6f1);border:1px dashed #9cd8ca;border-radius:18px;padding:14px;box-shadow:inset 0 2px 8px rgba(0,0,0,.03)}
  .dente{background:linear-gradient(145deg,#ffffff,#edf4f6);border:2px solid #cfe0e6;box-shadow:0 3px 8px rgba(0,0,0,.08);font-weight:700;color:#33576a;transition:transform .12s,box-shadow .12s}
  .dente:hover{transform:scale(1.18);box-shadow:0 10px 20px rgba(0,0,0,.2);border-color:var(--teal)}
  .dente.cariado{background:linear-gradient(145deg,#f25,#e03131)}
  .dente.restaurado{background:linear-gradient(145deg,#1d9fc4,#0b7285)}
  .dente.coroa{background:linear-gradient(145deg,#ff922b,#f76707)}
  .dente.canal{background:linear-gradient(145deg,#ffd43b,#f59f00)}
  .btn-como-funciona{background:linear-gradient(90deg,#12b886,#0ca678);border:none}
  .btn-ghost{border:none;padding:8px 14px;border-radius:9px}
  .btn-ghost:hover{filter:brightness(1.05);transform:none}
  .btn-tour{background:linear-gradient(90deg,#4dabf7,#3d97e8);border:none}
  #dicaExpli{background:linear-gradient(135deg,#0c2535,#0b5e6e);border:1px solid rgba(255,255,255,.15);border-radius:10px;box-shadow:0 12px 26px rgba(0,0,0,.35)}
  #tourCaixa{border-color:#f0c24b;border-radius:16px}

  /* ===== BUSCA, PROGRESSO, DESAFIOS E QUIZ ===== */
  .busca-wrap{margin:12px 10px 2px}
  #buscaMod{width:100%;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;font-size:.85rem;outline:none;transition:.15s}
  #buscaMod::placeholder{color:rgba(255,255,255,.45)}
  #buscaMod:focus{border-color:#38d9a9;background:rgba(255,255,255,.16)}
  .busca-dica{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.5);font-size:.7rem;padding:4px 14px 8px}
  .busca-dica b{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:1px 7px;font-size:.68rem}
  .prog-wrap{margin:0 10px 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
  .prog-topo{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:.78rem;font-weight:700;margin-bottom:6px}
  .prog-topo .zera{background:none;border:none;color:rgba(255,255,255,.55);font-size:.68rem;cursor:pointer;text-decoration:underline;padding:0}
  .prog-barra{height:8px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
  .prog-barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38d9a9,#4dabf7);border-radius:999px;transition:width .4s ease}
  .nav-item{position:relative}
  .nav-item .ok{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#38d9a9;font-size:.9rem;font-weight:800;opacity:0;transition:opacity .2s}
  .nav-item.feito .ok{opacity:1}
  .nav-item.foco{outline:2px solid #38d9a9;outline-offset:-2px;background:rgba(255,255,255,.12)}
  .nav-item.escondido{display:none}
  .btn-quiz{background:linear-gradient(90deg,#f59f00,#fbbf24);border:none;padding:8px 14px;border-radius:9px;color:#4a2e00;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(245,159,0,.35)}
  .btn-quiz:hover{filter:brightness(1.06)}
  .painel-desafios{background:linear-gradient(135deg,#f4f8ff,#ecf3ff);border:1px solid #cfe0ff;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:.85rem}
  .painel-desafios .tit{font-weight:800;margin-bottom:6px;color:#274a8c}
  .painel-desafios ul{list-style:none}
  .painel-desafios li{display:flex;align-items:center;gap:8px;padding:3px 0;color:#3a4a63}
  .painel-desafios li .ch{width:18px;height:18px;border-radius:6px;border:1px solid #b7c9e8;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;background:#fff;flex:none}
  .painel-desafios li.feito{color:#19794f;text-decoration:line-through}
  .painel-desafios li.feito .ch{background:#37b24d;border-color:#37b24d;color:#fff}
  .quiz-opcao{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 14px;border-radius:10px;border:1px solid #cfdfef;background:#fff;font-size:.9rem;cursor:pointer;transition:.12s}
  .quiz-opcao:hover:not([disabled]){border-color:#0ca678;background:#f0fbf8}
  .quiz-opcao.certo{background:#e6f9ef;border-color:#37b24d;color:#186534;font-weight:700}
  .quiz-opcao.errado{background:#fff1f0;border-color:#e03131;color:#a3260f}
  .quiz-fb{font-size:.9rem;margin-top:12px;font-weight:700}

  /* ===== MODO APRESENTAÇÃO (slides) ===== */
  .btn-apresenta{background:linear-gradient(135deg,#7048e8,#8466f0);border:none;color:#fff;padding:8px 14px;border-radius:9px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(112,72,232,.35);display:inline-flex;align-items:center;gap:6px}
  .btn-apresenta:hover{filter:brightness(1.06)}
  #slides{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 20% 10%,#0d5e6d,transparent),radial-gradient(900px 600px at 85% 15%,#0ca678,transparent),linear-gradient(160deg,#0a1c28,#0c3f52);color:#fff}
  #slides.aberto{display:flex}
  .slides-deck{width:min(880px,93vw);max-height:86vh;display:flex;flex-direction:column}
  .slides-topo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .slides-topo .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 14px;font-size:.78rem;font-weight:600}
  .slides-progresso{flex:1;height:6px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden}
  .slides-progresso i{display:block;height:100%;background:linear-gradient(90deg,#38d9a9,#4dabf7);border-radius:999px;transition:width .3s ease}
  .slides-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:22px;padding:42px 46px;animation:slideIn .45s ease;box-shadow:0 30px 70px rgba(0,0,0,.4);overflow:auto}
  @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
  .slides-icon{width:74px;height:74px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2.3rem;background:rgba(12,166,120,.22);border:1px solid rgba(56,217,169,.4);margin-bottom:18px}
  .slides-card h2{font-size:1.9rem;margin-bottom:6px;letter-spacing:-.01em}
  .slides-card .modulo-chip{display:inline-block;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:#8ae7c6;margin-bottom:16px;font-weight:700}
  .slides-card p{font-size:1.05rem;line-height:1.7;color:#e6f4f0}
  .slides-card ul{list-style:none;margin-top:8px}
  .slides-card li{font-size:1.02rem;line-height:1.6;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.14);display:flex;gap:10px}
  .slides-card li::before{content:"✦";color:#38d9a9}

function pacientesRows(lista,filtro){
  const f = filtro.toLowerCase();
  const listaF = lista.filter(p => !f || p.n.toLowerCase().includes(f) || (p.cpf||'').includes(f));
  if(!listaF.length) return `<tr><td colspan="7"><div class="aviso">Nenhum paciente encontrado para "${filtro}".</div></td></tr>`;
  return listaF.map(p=>`<tr>
    <td><button class="btn-link" onclick="abrirFicha()">${p.n}</button></td>
    <td>${p.cpf}</td><td>${p.cel}</td><td>${p.cons}</td><td>${p.orc}</td>
    <td>${p.st==='ativo'?'<span class="badge" style="background:#198754">Ativo</span>':'<span class="badge" style="background:#dc3545">Inativo</span>'}</td>
    <td><button class="btn gray fino" onclick="abrirFicha()">Abrir ficha</button></td></tr>`).join('');
}

  const nome=$('#np_nome').value.trim(), cpf=$('#np_cpf').value.trim(), cel=$('#np_cel').value.trim();
  if(!nome){ alert('Informe o nome do paciente.'); return; }
  if(cpf && estado.pacientes.some(p=>p.cpf===cpf)){ $('#np_erro').style.display='block'; return; }
  estado.pacientes.push({id:estado.pacientes.length+1,n:nome,cpf:cpf||'—',cel:cel||'—',st:$('#np_st').value,cons:0,orc:0});
  fez('paciente_criado');

  const c=estado.contas[i], saldo=c.valor-c.pago;
  const v=parseFloat($('#pg_val').value);
  if(v>saldo){ $('#pg_msg').innerHTML=`<div class="erro">⛔ Valor informado maior que o saldo devedor (R$ ${saldo.toFixed(2)}). O sistema real bloqueia esta operação.</div>`; return; }
  c.pago=Math.min(c.pago+v,c.valor);
  c.st = c.pago>=c.valor ? 'paga' : 'parcial'; c.forma=$('#pg_forma').value;

}

function salvarMov(i,tipo){
  const p=estado.produtos[i], q=parseInt($('#mov_qtd').value)||0;
  if(tipo==='saida' && q>p.est){ $('#mov_msg').innerHTML=`<div class="erro">⛔ Quantidade maior que o estoque atual (${p.est}). O sistema real bloqueia esta saída.</div>`; return; }
  const antes=p.est;
  p.est = tipo==='entrada' ? p.est+q : p.est-q;
  estado.estoqueHistorico.unshift({dt:'24/09',p:p.n,t:tipo,q});
  const ficouBaixo = p.est<=p.min;
  p.st_baixo = ficouBaixo;
  fez(tipo==='entrada'?'entrada':'saida');
  fecharModal(); mostrar('estoque');
  flash(`Movimentação registrada: ${antes} → ${p.est}${ficouBaixo?' — ⚠️ agora está abaixo do mínimo!':''} ✓`);
}

function presencaForm(i){
  const a=estado.atendimentos[i];
  const pacotes=estado.pacotes.filter(p=>p.pac===a.pac);
  return `<h3>✅ Registrar presença — ${a.pac}</h3>
  <div class="form-grid">
    <div class="full"><label>Procedimento</label><input value="${a.proc}" readonly></div>
    <div><label>Pacote do paciente</label><select id="at_pacote"><option value="">Sem pacote</option>${pacotes.map(p=>`<option value="${p.id}">${p.nome} (${p.sessoes-p.usadas} restantes)</option>`).join('')}</select></div>
    <div><label>Consumir sessão?</label><select id="at_consome"><option value="1">Sim, consumir 1 sessão</option><option value="0">Não consumir</option></select></div>
    <div class="full"><label><input type="checkbox" id="at_reposicao"> Marcar como <b>reposição de falta</b></label></div>
  </div>
  <div class="dica-treino" style="margin-top:12px">A baixa é <b>transacional</b>: se o pacote não tiver saldo, o sistema recusa o consumo em vez de deixar o saldo negativo.</div>
  <div class="acoes"><button class="btn gray" onclick="fecharModal()">Cancelar</button>
  <button class="btn verde" onclick="salvarPresenca(${i})">Confirmar presença</button></div>`;
}
function salvarPresenca(i){
  const a=estado.atendimentos[i];
  const pacoteId=parseInt($('#at_pacote').value)||null;
  const consome=$('#at_consome').value==='1';
  if(pacoteId && consome){
    const p=estado.pacotes.find(x=>x.id===pacoteId);
    if(!p || p.usadas>=p.sessoes){ alert('Este pacote não tem saldo para consumir. A baixa foi recusada.'); return; }
    p.usadas++; if(p.usadas>=p.sessoes) p.st='esgotado';
  }
  a.st='Presente'; a.reposicao=$('#at_reposicao').checked;
  fez('atend_presenca'); fecharModal(); mostrar('atendimentos');
  flash(`Presença confirmada${pacoteId&&consome?' — 1 sessão consumida do pacote ✓':' ✓'}`);
}
function marcarFalta(i){ estado.atendimentos[i].st='Falta'; fez('atend_falta'); mostrar('atendimentos'); flash('Falta registrada — o horário fica livre para reposição ✓'); }

  const nome=$('#tu_nome').value.trim();
  if(!nome){ alert('Informe o nome da turma.'); return; }
  estado.turmas.push({id:estado.turmas.reduce((m,t)=>Math.max(m,t.id),0)+1,nome,prof:$('#tu_prof').value,dias:$('#tu_dias').value||'Seg',hora:$('#tu_hora').value||'07:00',dur:parseInt($('#tu_dur').value)||50,cap:parseInt($('#tu_cap').value)||8,alunos:[],sala:$('#tu_sala').value||'Studio 1',st:'ativa'});

function consumirPacote(i){
  const p=estado.pacotes[i], saldo=p.sessoes-p.usadas;
  if(saldo<=0){ flash('Pacote sem saldo — o consumo foi recusado (nunca fica negativo).'); return; }
  if(!confirm(`Consumir 1 sessão do pacote "${p.nome}"? Restarão ${saldo-1}.`)) return;
  p.usadas++; if(p.usadas>=p.sessoes) p.st='esgotado';
  fez('pacote_consumido'); mostrar('pacotes'); flash(`1 sessão consumida — saldo agora: ${p.sessoes-p.usadas} ✓`);
}

  const nome=$('#lr_nome').value.trim();

  const id=estado.laserRegioes.reduce((m,r)=>Math.max(m,r.id),0)+1;

function salvarAplicacaoLaser(){

  const numero=proximaSessaoLaser(pac,regiao);
  estado.laserAplicacoes.unshift({data:$('#lh_data').value||'2026-09-24',pac,regiao,pacote,sessao:numero,prof:$('#lh_prof').value,obs:$('#lh_obs').value.trim()});

function salvarSocial(){
  const titulo=$('#so_titulo').value.trim();
  if(!titulo){ alert('Informe o título do post.'); return; }
  estado.social.unshift({id:estado.social.reduce((m,p)=>Math.max(m,p.id),0)+1,titulo,rede:$('#so_rede').value,data:$('#so_data').value||'2026-09-25',status:'pendente',autor:'Você'});
  fez('social_criado'); fecharModal(); mostrar('social'); flash('Post criado como pendente — aguardando aprovação ✓');
}
function aprovarPost(i){ estado.social[i].status='aprovado'; fez('social_aprovado'); mostrar('social'); flash('Post aprovado — pronto para publicar ✓'); }
function rejeitarPost(i){ estado.social[i].status='rejeitado'; fez('social_rejeitado'); mostrar('social'); flash('Post rejeitado — ajuste o conteúdo e reenvie.'); }

const LS='daianeTreinoV1';
let prog={feito:{},quiz:{}};
try{ const s=localStorage.getItem(LS); if(s){ const o=JSON.parse(s); prog.feito=o.feito||{}; prog.quiz=o.quiz||{}; } }catch(e){}
function salvarProg(){ try{ localStorage.setItem(LS,JSON.stringify(prog)); }catch(e){} }
function zerarProgresso(){
  if(!confirm('Apagar TODO o progresso, quizes e desafios?')) return;
  prog={feito:{},quiz:{}}; salvarProg(); atualizarProgresso(); flash('Progresso zerado — comece de novo!');
}
function fez(k){
  if(prog.feito[k]) return;
  prog.feito[k]=true; salvarProg(); atualizarProgresso();
}
function moduloConcluido(m){
  const chaves=CHAVES_MOD[m]||[];
  const todos=chaves.every(k=>prog.feito[k]);
  const quizOk=(prog.quiz[m]||0)>=70;
  return todos && quizOk;
}
function atualizarProgresso(){
  const total=ordemModulos.length;
  const completos=ordemModulos.filter(m=>moduloConcluido(m)).length;
  const bar=document.getElementById('progBarra'), num=document.getElementById('progNum');
  if(bar) bar.style.width=(completos/total*100).toFixed(1)+'%';
  if(num) num.textContent=completos+'/'+total;
  document.querySelectorAll('.nav-item').forEach(b=>{
    b.classList.toggle('feito', moduloConcluido(b.dataset.mod));
    if(!b.querySelector('.ok')) b.insertAdjacentHTML('beforeend','<span class="ok">✓</span>');
  });
}
function barraDesafios(mod){
  const ds=DESAFIOS[mod]||[];
  if(!ds.length) return '';
  const feitos=ds.filter(d=>prog.feito[d.k]).length;
  return `<div class="painel-desafios"><div class="tit">🎯 Desafios deste módulo — ${feitos}/${ds.length}${feitos===ds.length?' ✔ completo':''}</div>
    <ul>${ds.map(d=>`<li class="${prog.feito[d.k]?'feito':''}"><span class="ch">${prog.feito[d.k]?'✓':''}</span>${d.t}</li>`).join('')}</ul></div>`;
}
function registrar(tipo,msg){ fez(tipo); fecharModal(); flash(msg); }

/* ---- QUIZ ---- */
let quizState=null;
function abrirQuiz(mod){
  const q=QUIZ[mod]; if(!q){ flash('Quiz ainda não disponível para este módulo.'); return; }
  quizState={mod,q,i:0,acertos:0,escolheu:false};
  pintarQuiz();
}
function pintarQuiz(){
  const s=quizState, qu=s.q[s.i];
  abrirModal(`<div style="display:flex;justify-content:space-between;font-size:.78rem;color:#5a6a72;margin-bottom:8px"><b>🎯 Quiz — ${titulos[s.mod]}</b><b>Pergunta ${s.i+1}/${s.q.length}</b></div>
    <h3 style="font-size:1.05rem;margin-bottom:2px">${qu.q}</h3>
    <div>${qu.o.map((o,j)=>`<button class="quiz-opcao" onclick="quizResponder(${j})">${String.fromCharCode(65+j)}) ${o}</button>`).join('')}</div>
    <div id="quizFb"></div>
    <div class="acoes"><button class="btn gray" onclick="fecharQuiz()">Sair do quiz</button>
    <button class="btn teal" id="quizProx" style="display:none" onclick="quizProximo()">Próxima →</button></div>`);
}
function quizResponder(j){
  if(quizState.escolheu) return;
  quizState.escolheu=true;
  const qu=quizState.q[quizState.i], certo=j===qu.c;
  if(certo) quizState.acertos++;
  document.querySelectorAll('.quiz-opcao').forEach((b,k)=>{
    if(k===qu.c) b.classList.add('certo');
    else if(k===j) b.classList.add('errado');
    b.disabled=true;
  });
  const ultima=quizState.i===quizState.q.length-1;
  $('#quizFb').innerHTML=`<div class="quiz-fb" style="color:${certo?'#2b8a3e':'#e03131'}">${certo?'✔ Correto!':'✘ Não foi dessa vez.'} ${certo?'':'A resposta certa é a destacada em verde.'}</div>`;
  $('#quizProx').style.display='';
  $('#quizProx').textContent=ultima?'Ver resultado':'Próxima →';
}
function quizProximo(){
  if(quizState.i<quizState.q.length-1){ quizState.i++; quizState.escolheu=false; pintarQuiz(); return; }
  quizResultado();
}
function quizResultado(){
  const s=quizState;
  const pct=Math.round(s.acertos/s.q.length*100), aprov=pct>=70;
  if(pct>(prog.quiz[s.mod]||0)){ prog.quiz[s.mod]=pct; salvarProg(); atualizarProgresso(); }
  const faltam=CHAVES_MOD[s.mod].filter(k=>!prog.feito[k]);
  const ok=aprov && !faltam.length;
  abrirModal(`<h3>🏆 Resultado — ${titulos[s.mod]}</h3>
    <div class="cards" style="margin:12px 0">
      <div class="card-kpi"><div class="v">${s.acertos}/${s.q.length}</div><div class="r">Acertos</div></div>
      <div class="card-kpi"><div class="v" style="color:${aprov?'#2b8a3e':'#e03131'}">${pct}%</div><div class="r">${aprov?'✔ Aprovado':'Meta: 70%'}</div></div>
    </div>
    ${ok?'<div class="dica-treino" style="border-left-color:#37b24d;background:#f0fbf6"><b>🎉 Módulo concluído!</b> Quiz + desafios completos — o ✓ já aparece no menu lateral e o progresso subiu.</div>'
      :!aprov?'<div class="dica-treino">📚 Aproveitamento abaixo de 70%. Assista à Visita guiada ☝ e tente o quiz de novo (a nota não cai).</div>'
      :`<div class="dica-treino">⏳ Falta concluir: <b>${faltam.map(k=>{const d=(DESAFIOS[s.mod]||[]).find(x=>x.k===k);return d?d.t:'(desafio)';}).join(' · ')}</b></div>`}
    <div class="expli-rodape">Sua melhor nota por módulo fica salva. Refaça quando quiser — só conta a maior.</div>
    <div class="acoes"><button class="btn gray" onclick="fecharModal()">Fechar</button>
      ${aprov?`<button class="btn teal" onclick="fecharModal();irProximoModulo('${s.mod}')">Próximo módulo ▶</button>`
             :`<button class="btn teal" onclick="fecharModal();iniciarTour('${s.mod}')">Revisar com Visita guiada</button>`}</div>`);
  quizState=null;
}
function fecharQuiz(){ quizState=null; fecharModal(); }
function irProximoModulo(m){
  const i=ordemModulos.indexOf(m);
  const prox=ordemModulos[(i+1)%ordemModulos.length]||ordemModulos[0];
  mostrar(prox); flash('Avançou para '+titulos[prox]+' — prossiga no treinamento.');
}

  const box=buscaEl.value.trim().toLowerCase();
  const itens=Array.from(document.querySelectorAll('.nav-item'));
  itens.forEach(b=>{ b.classList.remove('escondido'); b.classList.remove('foco'); });
  if(!box){ buscaLista=[]; buscaAtual=-1; return; }
  buscaLista=itens.filter(b=>(titulos[b.dataset.mod]||'').toLowerCase().includes(box)||b.textContent.toLowerCase().includes(box)||(expNav[b.dataset.mod]||'').toLowerCase().includes(box));
  itens.forEach(b=>b.classList.toggle('escondido',!buscaLista.includes(b)));
  buscaAtual=buscaLista.length?0:-1;
  destacarBusca();
}
function destacarBusca(){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('foco'));
  if(buscaAtual>=0 && buscaLista[buscaAtual]) buscaLista[buscaAtual].classList.add('foco');
}
buscaEl.addEventListener('input',filtrarBusca);
buscaEl.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); if(buscaLista.length){ buscaAtual=(buscaAtual+1)%buscaLista.length; destacarBusca(); } }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(buscaLista.length){ buscaAtual=(buscaAtual-1+buscaLista.length)%buscaLista.length; destacarBusca(); } }
  else if(e.key==='Enter'){ if(buscaAtual>=0&&buscaLista[buscaAtual]){ const m=buscaLista[buscaAtual].dataset.mod; buscarFechar(); mostrar(m); } }
  else if(e.key==='Escape'){ buscarFechar(); }
});
function buscarFechar(){ buscaEl.value=''; buscaEl.blur(); filtrarBusca(); }
document.addEventListener('keydown',e=>{
  const t=document.activeElement;
  const digitando=t && (['INPUT','TEXTAREA','SELECT'].includes(t.tagName)||t.isContentEditable);
  if(digitando) return;
  if(e.key==='/'||((e.key==='k'||e.key==='K')&&(e.ctrlKey||e.metaKey))){ e.preventDefault(); buscaEl.focus(); buscaEl.select(); }
});

  contratos:'O módulo <b>Contratos</b> registra termos e consentimentos por paciente (tipo livre + conteúdo). O status controla o ciclo: <b>Pendente → Assinado</b> (com data) ou <b>Cancelado</b>. É a camada documental do atendimento.',
  relatorios:'O <b>Relatórios</b> é a central de indicadores por período (padrão: mês vigente). Reúne (1) resumo financeiro — a receber, em aberto, pago e <b>recebido no período</b>; (2) resumo da agenda — atendidas, canceladas e <b>faltas</b>; e (3) resumo do estoque — produtos, baixos e entradas/saídas. Ideal para acompanhar caixa e reposição.',

const divDica = document.createElement('div');
divDica.id='dicaExpli';
document.body.appendChild(divDica);
let alvoDica=null;

function anotar(mod){
  (ANOTACOES[mod]||[]).forEach(([sel,texto])=>{
    document.querySelectorAll('#page '+sel).forEach(el=>{ if(!el.dataset.explicacao) el.dataset.explicacao=texto; });
  });
}
function mostrarDica(el, x, y){
  if(!el){ divDica.style.opacity=0; alvoDica=null; return; }
  alvoDica=el;
  divDica.textContent=el.dataset.explicacao;
  divDica.style.opacity=1;
  const r=el.getBoundingClientRect();
  const lx = Math.min(r.right+12, innerWidth-340);
  divDica.style.left = Math.max(6, lx)+'px';
  divDica.style.top  = Math.max(6, (y||r.top))+10+'px';
}
document.addEventListener('mouseover', e=>{
  const el=e.target.closest && e.target.closest('[data-explicacao]');
  if(el===alvoDica) return;
  if(el) mostrarDica(el, e.clientX, e.clientY);
  else mostrarDica(null);
});
document.addEventListener('mouseout', e=>{
  const el=e.target.closest && e.target.closest('[data-explicacao]');
  if(el && e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-explicacao]')===el) return;
  if(!el || !e.relatedTarget) mostrarDica(null);
});
document.addEventListener('click', e=>{
  const expli=e.target.closest && e.target.closest('[data-explicacao]');
  if(expli && !expli.closest('[onclick]') && !['INPUT','SELECT','TEXTAREA','BUTTON'].includes(expli.tagName)){
    abrirModal(`<h3>💡 ${expli.dataset.explicacao.split(/[.:]/)[0]} — como funciona</h3><p style="font-size:.92rem">${expli.dataset.explicacao}</p>
      <div class="expli-rodape">🖱️ Passe o mouse em outros elementos da tela para ler mais explicações, ou use a <b>Visita guiada</b> (botão azul acima) para ver tudo passo a passo.</div>
      <div class="acoes"><button class="btn teal" onclick="fecharModal()">Entendi</button></div>`);
  }
});

/* ===== COMO FUNCIONA / VISITA GUIADA ===== */
document.addEventListener('click', e=>{
  const cf=e.target.closest && e.target.closest('.btn-como-funciona');
  if(cf){
    const m=cf.dataset.mod;

      <div class="acoes"><button class="btn teal" onclick="fecharModal()">Entendi</button></div>`);
    return;

const tourCaixa=document.createElement('div');
tourCaixa.id='tourCaixa';
tourCaixa.style.display='none';
document.body.appendChild(tourCaixa);
const tourDim=document.createElement('div');
tourDim.id='tourDim';
document.body.appendChild(tourDim);
let tourState=null;
function iniciarTour(mod){
  tourState={mod:(mod||location.hash.replace('#','')||'dashboard'),i:0};
  montarLista();
  pintarTour();
}
function montarLista(){
  tourState.lista=Array.from(document.querySelectorAll('#page [data-explicacao]')).filter(el=>el.offsetParent!==null);
}
function pintarTour(){
  const t=tourState;
  if(!t.lista.length){ flash('Esta tela não tem passos guiados.'); fecharTour(); return; }
  if(t.i>=t.lista.length) t.i=t.lista.length-1;
  const el=t.lista[t.i];
  turDim();
  const pos=getComputedStyle(el).position;
  if(pos==='static') el.style.position='relative';
  el.style.zIndex='100';
  el.style.outline='3px solid #f59f00'; el.style.outlineOffset='3px';
  el.style.boxShadow='0 0 0 9999px rgba(7,20,30,.45), 0 10px 30px rgba(0,0,0,.35)';
  el.scrollIntoView({behavior:'smooth', block:'center'});
  tourCaixa.style.display='block';
  const ultimo=t.i===t.lista.length-1;
  tourCaixa.innerHTML=`<div class="cont"><span class="num">PASSO ${t.i+1}/${t.lista.length}</span>
    <div style="flex:1"><p style="font-size:.9rem">${el.dataset.explicacao}</p>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn gray fino" ${t.i===0?'disabled':''} onclick="tourAnt()">← Anterior</button>
      <button class="btn fino" ${ultimo?'disabled':''} onclick="tourProx()">Próximo →</button>
      <button class="btn teal fino" ${ultimo?'style="display:inline-flex;gap:4px"':''} onclick="tourProximoModulo()">${ultimo?'⏭ Concluído — ir p/ próximo módulo':'⏭ Pular p/ próximo módulo'}</button>
      <button class="btn gray fino" onclick="fecharTour(true)">Encerrar</button>
    </div></div></div>`;
}
function turDim(){
  const page=$('#page'), alvo=tourState.lista[tourState.i];
  tourDim.style.display='block';
  const caminho=[]; let x=alvo;
  while(x && x!==page){ caminho.push(x); x=x.parentElement; }
  Array.from(page.querySelectorAll('*')).forEach(n=>{
    n.style.opacity='';
    if(caminho.includes(n) || n===alvo){ n.style.position='relative'; n.style.zIndex='100'; }
    else n.style.zIndex='';
  });
}
function tourAnt(){ if(tourState && tourState.i>0){ tourState.i--; pintarTour(); } }
function tourProx(){ if(tourState && tourState.i<tourState.lista.length-1){ tourState.i++; pintarTour(); } }
function tourProximoModulo(){
  const atual=tourState.mod;
  const i=ordemModulos.indexOf(atual);
  const prox=ordemModulos[(i+1)%ordemModulos.length]||ordemModulos[0];
  fecharTour();
  mostrar(prox);
  iniciarTour(prox);
  flash('Avançou para '+titulos[prox]+' — pesquise e treine.');
}
function fecharTour(credito){
  if(credito && tourState && tourState.mod && tourState.lista && tourState.i===tourState.lista.length-1){
    fez('tour_'+tourState.mod);
  }
  document.querySelectorAll('#page *').forEach(n=>{ n.style.opacity=''; n.style.outline=''; n.style.boxShadow=''; n.style.zIndex=''; n.style.position=''; });
  tourCaixa.style.display='none'; tourDim.style.display='none'; tourState=null;
}

/* ===== MODO APRESENTAÇÃO ===== */
const ordemModulos=['dashboard','pacientes','agenda','atendimentos','turmas','prontuario','avaliacao','evolucao','pacotes','laser','orcamentos','financeiro','pagamentos','contas_pagar','fornecedores','fluxo_caixa','duplicatas','notas_fiscais','convenios','profissionais','procedimentos','estoque','contratos','relatorios','rel_receitas','rel_presenca','rel_pacotes','rel_aniversariantes','documentos','admin','perfis','clinica','auditoria','social','notificacoes'];
const iconesMod={dashboard:'🏠',pacientes:'🧑‍⚕️',agenda:'📅',atendimentos:'✅',turmas:'🧘',prontuario:'📋',avaliacao:'🧾',evolucao:'📈',pacotes:'🎟️',laser:'✨',orcamentos:'💼',financeiro:'💰',pagamentos:'💵',contas_pagar:'📤',fornecedores:'🏭',fluxo_caixa:'🌊',duplicatas:'🔁',notas_fiscais:'🧾',convenios:'🤝',profissionais:'👩‍⚕️',procedimentos:'🧰',estoque:'📦',contratos:'📜',relatorios:'📊',rel_receitas:'📈',rel_presenca:'✅',rel_pacotes:'🎟️',rel_aniversariantes:'🎂',documentos:'📁',admin:'👤',perfis:'🔐',clinica:'🏥',auditoria:'🔍',social:'📣',notificacoes:'🔔'};
function passosLista(mod){
  return Array.from((treinoInfo[mod]||'').matchAll(/<li>(.*?)<\/li>/g)).map(m=>m[1]);
}
function montarDeck(){
  const deck=[];
  ordemModulos.forEach(mod=>{
    const passos=passosLista(mod);
    deck.push({mod,titulo:titulos[mod],icon:iconesMod[mod],tipo:'Capa do módulo',corpo:`<p style="font-size:1.25rem;font-weight:600">${expNav[mod]||''}</p>`});
    deck.push({mod,titulo:'Como funciona',icon:'❓',tipo:titulos[mod],corpo:`<p>${EXP_MSG[mod]||''}</p>`});
    if(passos.length) deck.push({mod,titulo:'Na prática',icon:'🎯',tipo:titulos[mod],itens:passos});
  });
  return deck;
}
const deckSlides=montarDeck();
let slideI=0;
function abrirSlides(){
  const modAtual=(location.hash||'#dashboard').replace('#','');
  const i0=deckSlides.findIndex(s=>s.mod===modAtual);
  slideI=i0>=0?i0:0;
  renderSlide();
  document.getElementById('slides').classList.add('aberto');
  document.body.style.overflow='hidden';
}
function fecharSlides(){
  document.getElementById('slides').classList.remove('aberto');
  document.body.style.overflow='';
}
function slideVai(n){
  slideI=(slideI+n+deckSlides.length)%deckSlides.length;
  renderSlide();
}
function renderSlide(){
  const s=deckSlides[slideI], card=document.getElementById('slideCard');
  document.getElementById('slideModChip').textContent=iconesMod[s.mod]+' '+titulos[s.mod];
  document.getElementById('slideContador').textContent=(slideI+1)+' / '+deckSlides.length;
  document.getElementById('slideBarra').style.width=((slideI+1)/deckSlides.length*100)+'%';
  const lista=s.itens?`<ul>${s.itens.map(i=>`<li>${i}</li>`).join('')}</ul>`:'';
  const corpo=s.corpo||'';
  const html=`<div class="slides-icon">${s.icon}</div>
    <span class="modulo-chip">${s.titulo}</span>
    <h2>${s.tipo}</h2>
    ${corpo}
    ${lista}`;
  card.style.animation='none'; void card.offsetWidth;
  card.style.animation='slideIn .45s ease';
  card.innerHTML=html;
  card.scrollTop=0;
}
document.addEventListener('keydown', e=>{
  if(!document.getElementById('slides').classList.contains('aberto')) return;
  if(e.key==='ArrowRight') slideVai(1);
  else if(e.key==='ArrowLeft') slideVai(-1);
  else if(e.key==='Escape') fecharSlides();
});

  window.location.hash=mod;
}
